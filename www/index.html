<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixelQuest</title>
    <link rel="icon" href="icon.png" type="image/png">
    <style>
        /* Yüksek Çözünürlüklü & Simetrik Piksel Sanatı Tasarımı */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
            image-rendering: pixelated;
        }
        body {
            background-color: #0b0b0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }
        .phone-frame {
            width: 100vw;
            height: 100vh;
            max-width: 430px;
            max-height: 890px;
            background: #000;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
        }
        @media(min-width: 440px) {
            .phone-frame {
                border: 6px solid #2b2b36;
                box-shadow: 0 0 0 4px #14141c, 0 0 40px rgba(0,0,0,0.9);
                height: 850px;
            }
        }
        
        /* Dinamik Animasyonlu Canvas Arka Plan (Aynen Korundu) */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Arayüz Katmanı */
        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: rgba(10, 10, 15, 0.28);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            overflow-y: auto;
            padding: 16px;
        }
        .app-container::-webkit-scrollbar {
            width: 6px;
        }
        .app-container::-webkit-scrollbar-thumb {
            background: rgba(255,215,0,0.4);
            border: 1px solid #000;
        }

        /* Piksel Kutular İçin Ortak Sınıf */
        .pixel-box {
            background: rgba(20, 22, 34, 0.88);
            border: 3px solid #444860;
            box-shadow: 
                inset 2px 2px 0px rgba(255, 255, 255, 0.15),
                inset -2px -2px 0px rgba(0, 0, 0, 0.6),
                0 4px 0px rgba(0, 0, 0, 0.5);
        }

        /* Header / Rütbe Barı */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            margin-bottom: 14px;
        }
        .rank-info {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .rank-badge {
            width: 46px;
            height: 46px;
            background: #141622;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid #666;
            box-shadow: inset 2px 2px 0px rgba(255,255,255,0.2), inset -2px -2px 0px rgba(0,0,0,0.8);
            position: relative;
            transition: transform 0.2s;
        }
        .rank-badge.gold-frame {
            border-color: #ffd700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.6), inset 2px 2px 0px #fff8b0;
        }
        .rank-text h3 {
            font-size: 14px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 2px 2px 0px #000;
            letter-spacing: 0.5px;
        }
        .rank-text p {
            font-size: 11px;
            color: #ddd;
            text-shadow: 1px 1px 0px #000;
        }
        .xp-bar-container {
            width: 100px;
            background: #0d0e14;
            height: 10px;
            margin-top: 4px;
            border: 2px solid #555;
            padding: 1px;
        }
        .xp-bar-fill {
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                #4facfe,
                #4facfe 4px,
                #00f2fe 4px,
                #00f2fe 8px
            );
            width: 0%;
            transition: width 0.6s ease;
        }

        /* Ayarlar İkonu Butonu */
        .settings-btn {
            background: #23263a;
            border: 3px solid #585d7a;
            box-shadow: inset 2px 2px 0px rgba(255,255,255,0.2), inset -2px -2px 0px rgba(0,0,0,0.7);
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .settings-btn:active {
            transform: translateY(2px);
        }

        /* Haftalık Seri Barı */
        .weekly-series {
            padding: 12px 10px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            transition: all 1s ease;
        }
        .weekly-series.weekly-grand-merged {
            background: #ffd700 !important;
            border-color: #fff8b0 !important;
            box-shadow: 0 0 25px #ffd700, inset 3px 3px 0px #fff;
            justify-content: center !important;
            min-height: 68px;
        }
        .day-box {
            width: 40px;
            height: 48px;
            background: #12131c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
            border: 2px solid #383b4d;
            color: #888;
            transition: all 0.5s ease;
        }
        .day-box.has-star {
            border-color: #ffd700;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.12);
        }
        .day-star-slot {
            width: 22px;
            height: 22px;
            margin-top: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Bölüm Başlığı */
        .section-title {
            font-size: 12px;
            color: #ffd700;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
        }

        /* Görev Listesi */
        .tasks-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
        }

        /* Görev Kartı */
        .task-card {
            background: rgba(24, 26, 42, 0.88);
            border: 3px solid #4d5270;
            box-shadow: 
                inset 2px 2px 0px rgba(255, 255, 255, 0.15),
                inset -2px -2px 0px rgba(0, 0, 0, 0.7),
                0 4px 0px rgba(0, 0, 0, 0.5);
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: border-color 0.3s, background-color 0.3s;
            position: relative;
            overflow: hidden;
            min-height: 66px;
        }
        .task-card:hover {
            border-color: #828ab8;
        }
        .task-info h4 {
            font-size: 13px;
            color: #fff;
            margin-bottom: 5px;
            font-weight: bold;
            line-height: 1.3;
            text-shadow: 1px 1px 0px #000;
        }
        .task-info .meta {
            font-size: 10px;
            color: #aeb4d4;
            display: flex;
            gap: 8px;
        }
        .task-xp {
            background: #2b2410;
            color: #ffd700;
            padding: 5px 8px;
            font-size: 11px;
            font-weight: bold;
            border: 2px solid #b8860b;
            text-shadow: 1px 1px 0px #000;
            white-space: nowrap;
        }

        /* Yavaşça Yayılan Altın Sarısı Arka Plan Efekti */
        .gold-spread-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: #ffd700;
            transform: translate(-50%, -50%) scale(0);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
            animation: slowGoldSpread 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes slowGoldSpread {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0.7; }
            100% { transform: translate(-50%, -50%) scale(45); opacity: 1; }
        }

        /* Tamamlanmış Görev Kartı */
        .task-card.completed {
            background: #ffd700 !important;
            border-color: #fff4a3 !important;
            box-shadow: inset 3px 3px 0px #fff, inset -3px -3px 0px #b8860b, 0 0 20px rgba(255, 215, 0, 0.7) !important;
            justify-content: center !important;
            cursor: default;
        }
        .task-card.completed .task-info,
        .task-card.completed .task-xp {
            display: none !important;
        }

        /* Görev Tamamlanırken Sağdan ve Soldan Yavaşça Gelip Ortada Birleşen Piksel Yıldızlar */
        .merging-star-left, .merging-star-right {
            position: absolute;
            top: 50%;
            width: 30px;
            height: 30px;
            z-index: 5;
            pointer-events: none;
            transform: translateY(-50%);
        }
        @keyframes slowMergeLeft {
            0% { left: 10px; transform: translateY(-50%) scale(0.7) rotate(0deg); opacity: 0.4; }
            60% { left: calc(50% - 26px); transform: translateY(-50%) scale(1.05) rotate(180deg); opacity: 1; }
            100% { left: calc(50% - 15px); transform: translateY(-50%) scale(1.1) rotate(360deg); opacity: 0; }
        }
        @keyframes slowMergeRight {
            0% { right: 10px; transform: translateY(-50%) scale(0.7) rotate(0deg); opacity: 0.4; }
            60% { right: calc(50% - 26px); transform: translateY(-50%) scale(1.05) rotate(-180deg); opacity: 1; }
            100% { right: calc(50% - 15px); transform: translateY(-50%) scale(1.1) rotate(-360deg); opacity: 0; }
        }
        .anim-merge-left {
            animation: slowMergeLeft 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .anim-merge-right {
            animation: slowMergeRight 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Ortada Beliren Kırmızı Çekirdekli Simetrik Piksel Yıldız */
        .center-pixel-star {
            position: relative;
            z-index: 6;
            width: 36px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: centerStarAppear 0.8s ease-out forwards, starIdleFloat 2s infinite alternate ease-in-out 0.8s;
        }
        @keyframes centerStarAppear {
            0% { transform: scale(0.2); opacity: 0; }
            60% { transform: scale(1.22); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes starIdleFloat {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* 5 Saniye Onay / Tamamlama Modu */
        .task-card.pending-confirm {
            border-color: #ffd700;
            background: rgba(45, 40, 20, 0.92);
        }
        .confirm-box {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 8px;
        }
        .confirm-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .confirm-top span {
            font-size: 12px;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 1px 1px 0px #000;
        }
        .confirm-btn {
            background: #ffd700;
            color: #000;
            border: 2px solid #fff;
            box-shadow: inset -2px -2px 0px #b8860b;
            padding: 6px 14px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }
        .countdown-bar {
            width: 100%;
            height: 6px;
            background: #111;
            border: 1px solid #555;
        }
        .countdown-fill {
            height: 100%;
            background: #ffd700;
            width: 100%;
            transition: width 5s linear;
        }

        /* Yeni Görev İsteme: Kareden Görev Kartı Dikdörtgenine Büyüyüp İçinden Görev Çıkaran Artı */
        .add-task-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            position: relative;
        }
        .morph-plus-btn {
            width: 62px;
            height: 62px;
            background: rgba(24, 26, 42, 0.9);
            border: 3px solid #ffd700;
            box-shadow: 
                inset 2px 2px 0px rgba(255, 255, 255, 0.2),
                inset -2px -2px 0px rgba(0, 0, 0, 0.8),
                0 4px 0px rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: width 0.55s cubic-bezier(0.22, 1, 0.36, 1), height 0.55s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s;
        }
        .morph-plus-btn:hover:not(.expanding) {
            transform: scale(1.05);
        }
        /* Tıklandığında görev kartı boyutunda dikdörtgene genişler */
        .morph-plus-btn.expanding {
            width: 100%;
            height: 68px;
            border-color: #4d5270;
            cursor: default;
        }
        .plus-half-left, .plus-half-right {
            position: absolute;
            width: 32px;
            height: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3;
            transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.25s, opacity 0.65s ease 0.3s;
        }
        .plus-half-left {
            clip-path: inset(0 50% 0 0);
        }
        .plus-half-right {
            clip-path: inset(0 0 0 50%);
        }
        /* Genişlerken artı ortadan ikiye bölünüp sağa ve sola açılır */
        .morph-plus-btn.expanding .plus-half-left {
            transform: translateX(-140px);
            opacity: 0;
        }
        .morph-plus-btn.expanding .plus-half-right {
            transform: translateX(140px);
            opacity: 0;
        }
        /* Artı açılırken içinden beliren yeni görev önizlemesi */
        .emerging-task-preview {
            width: 100%;
            padding: 0 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            transform: scale(0.88);
            transition: opacity 0.55s ease 0.45s, transform 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.45s;
            z-index: 2;
            pointer-events: none;
        }
        .morph-plus-btn.expanding .emerging-task-preview {
            opacity: 1;
            transform: scale(1);
        }

        /* Modallar (Rütbe Listesi & Ayarlar) */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 250;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: #1a1c2b;
            border: 4px solid #ffd700;
            box-shadow: inset 3px 3px 0px rgba(255,255,255,0.2), inset -3px -3px 0px rgba(0,0,0,0.8);
            padding: 18px;
            width: 90%;
            max-width: 360px;
            max-height: 82vh;
            overflow-y: auto;
        }
        .modal-card h2 {
            color: #ffd700;
            font-size: 15px;
            text-align: center;
            margin-bottom: 14px;
            text-shadow: 2px 2px 0px #000;
            letter-spacing: 1px;
        }
        .rank-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 2px solid #2b2e42;
            font-size: 12px;
        }
        .rank-list-item.current {
            background: rgba(255, 215, 0, 0.18);
            border: 2px solid #ffd700;
            color: #ffd700;
            font-weight: bold;
        }
        .close-modal-btn {
            width: 100%;
            margin-top: 14px;
            background: #ffd700;
            color: #000;
            border: 2px solid #fff;
            box-shadow: inset -2px -2px 0px #b8860b;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        /* Rütbe Atlama Titreme Efekti */
        @keyframes rankShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-5px, 2px) rotate(-4deg); }
            40% { transform: translate(5px, -2px) rotate(4deg); }
            60% { transform: translate(-5px, -2px) rotate(-3deg); }
            80% { transform: translate(5px, 2px) rotate(3deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .shake-animation {
            animation: rankShake 0.8s ease-in-out;
        }

        /* Ayarlar Formu */
        .settings-group {
            margin-bottom: 12px;
        }
        .settings-group label {
            font-size: 11px;
            color: #ccc;
            display: block;
            margin-bottom: 4px;
        }
        .settings-group input {
            width: 100%;
            background: #0f101a;
            border: 2px solid #4d5270;
            padding: 8px;
            color: #fff;
            font-family: inherit;
            font-size: 12px;
        }

        /* Yavaş ve Profesyonel Açılış Animasyonu */
        #splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0e0e18;
            z-index: 400;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            overflow: hidden;
            transition: opacity 1.3s cubic-bezier(0.25, 1, 0.5, 1), transform 1.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #splash-screen.zoom-out {
            opacity: 0;
            transform: scale(6);
            pointer-events: none;
        }
        .splash-icon-img {
            width: 96px;
            height: 96px;
            image-rendering: pixelated;
            animation: splashBreath 1.4s infinite alternate ease-in-out;
        }
        @keyframes splashBreath {
            0% { transform: scale(0.95); filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.4)); }
            100% { transform: scale(1.08); filter: drop-shadow(0 0 28px rgba(255, 215, 0, 0.85)); }
        }
        .splash-label {
            color: #ffd700;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 2px 2px 0px #000;
        }
    </style>
</head>
<body>

<div class="phone-frame">
    <!-- Yavaş Açılış Ekranı: Simetrik Yıldız İkonu -->
    <div id="splash-screen">
        <img src="icon.png" alt="PixelQuest" class="splash-icon-img" onerror="this.style.display='none'">
        <div class="splash-label">PIXELQUEST</div>
    </div>

    <!-- Rütbe Listesi Modalı -->
    <div class="modal-overlay" id="rank-modal">
        <div class="modal-card">
            <h2>RÜTBE KADEMELERİ</h2>
            <div id="rank-list-container"></div>
            <button class="close-modal-btn" onclick="toggleRankModal(false)">KAPAT</button>
        </div>
    </div>

    <!-- Ayarlar Modalı -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-card">
            <h2>BİLDİRİM AYARLARI</h2>
            <p style="font-size:11px; color:#bbb; margin-bottom:12px;">Günlük 3 bildirim zamanını ayarlayın:</p>
            <div class="settings-group">
                <label>1. Bildirim (Sabah)</label>
                <input type="time" id="notif-1" value="09:00">
            </div>
            <div class="settings-group">
                <label>2. Bildirim (Öğleden Sonra)</label>
                <input type="time" id="notif-2" value="14:00">
            </div>
            <div class="settings-group">
                <label>3. Bildirim (Akşam)</label>
                <input type="time" id="notif-3" value="20:00">
            </div>
            <button class="close-modal-btn" onclick="saveSettings()">KAYDET & AKTİFLEŞTİR</button>
        </div>
    </div>

    <!-- Animasyonlu Kanvas Arka Plan (Aynen Korundu) -->
    <canvas id="bg-canvas"></canvas>

    <!-- Uygulama Arayüzü -->
    <div class="app-container">
        <!-- Header -->
        <div class="header pixel-box">
            <div class="rank-info" onclick="toggleRankModal(true)">
                <div class="rank-badge" id="rank-badge-icon"></div>
                <div class="rank-text">
                    <h3 id="rank-title">Demir I</h3>
                    <p><span id="current-xp">0</span> / <span id="max-xp">100</span> XP</p>
                    <div class="xp-bar-container">
                        <div class="xp-bar-fill" id="xp-fill"></div>
                    </div>
                </div>
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
                <div style="font-size: 11px; color: #ddd; text-shadow: 1px 1px 0 #000;" id="time-display">07:00</div>
                <button class="settings-btn" onclick="toggleSettingsModal(true)" title="Ayarlar">
                    <!-- Keskin ve Simetrik 16x16 Piksel Dişli Ayarlar İkonu -->
                    <svg width="22" height="22" viewBox="0 0 16 16" shape-rendering="crispEdges">
                        <path fill="#111" d="M6 0h4v2h1v1h2v2h1v6h-1v2h-2v1h-1v2H6v-2H5v-1H3v-2H2V5h1V3h2V2h1V0z"/>
                        <path fill="#c5cbd8" d="M7 1h2v2h2V2h1v1h1v2h2v2h-2v2h2v2h-2v2h-1v1h-1v-1H9v2H7v-2H5v1H4v-1H3v-2H1V9h2V7H1V5h2V3h1V2h1v1h2V1z"/>
                        <path fill="#687085" d="M6 5h4v6H6V5z"/>
                        <path fill="#141622" d="M7 6h2v4H7V6z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Haftalık Seri -->
        <div class="weekly-series pixel-box" id="weekly-container"></div>

        <!-- Görevler -->
        <div class="section-title">Günlük Görevler</div>
        <div class="tasks-container" id="tasks-list"></div>

        <!-- Yeni Görev İsteme: Kareden Dikdörtgen Görev Kartına Büyüyüp İçinden Görev Çıkaran Artı -->
        <div class="add-task-container">
            <div class="morph-plus-btn" id="plus-btn" onclick="addNewTaskWithMorph(this)">
                <div class="plus-half-left">
                    <svg width="28" height="28" viewBox="0 0 16 16" shape-rendering="crispEdges">

        };
        const p = palettes[type] || palettes["gold"];

        // 20x20 kusursuz simetrik piksel yıldız yolları
        let coreSVG = "";

            coreSVG = `<path fill="${p.core}" d="M9 8h2v1h1v2h-1v1H9v-1H8V9h1V8z"/>`;

            <!-- Sol Üst Parlama Vurgusu -->

                M9 3h1v3H8v1H4v1h3v1H6V7h2V5h1V3z

        // 2. Spor & Hareket Görevleri (Zorluk derecesi sayıya göre otomatik ayarlanır)
        const sportExercises = [
            { unit: "adet şınav çek", counts: [10, 15, 20, 30, 40, 50] },

        ];
        sportExercises.forEach(ex => {
            ex.counts.forEach((c, idx) => {
                let diff = idx <= 1 ? "Kolay" : (idx <= 3 ? "Orta" : "Zor");
                let xp = diff === "Kolay" ? 10 : (diff === "Orta" ? 15 : 25);
                add(`${c} ${ex.unit}`, "Spor", xp, diff);
            });

        // 3. Kişisel Gelişim, Okuma & Odaklanma Görevleri
        const growthTasks = [
            { unit: "sayfa kitap oku", counts: [10, 15, 20, 30, 40, 50] },
            { unit: "dakika boyunca telefonuna hiç bakmadan odaklan", counts: [20, 30, 45, 60, 90] },

            { unit: "dakika boyunca yürüyüş yaparken podcast veya sesli kitap dinle", counts: [15, 20, 30, 40] }
        ];
        growthTasks.forEach(gt => {
            gt.counts.forEach((c, idx) => {
                let diff = idx <= 1 ? "Kolay" : (idx <= 3 ? "Orta" : "Zor");
                let xp = diff === "Kolay" ? 10 : (diff === "Orta" ? 15 : 25);
                add(`Bugün en az ${c} ${gt.unit}`, "Gelişim", xp, diff);
            });
        });

        // 4. Kültür & Genel Kültür (Maksimum 2'şer adet dengeli ve ilgi çekici)
        const cultureTasks = [
            ["Tarihte bugün neler yaşandığına dair 5 dakikalık ilginç bir okuma yap", "Kültür", 10, "Kolay"],

            ["Ünlü bir ressamın en bilinen tablosunun hikayesini incele", "Sanat", 10, "Kolay"],

            ["Beden dili ve etkili iletişim üzerine kısa bir ipucu öğrenip bugün uygula", "Psikoloji", 15, "Orta"]
        ];
        cultureTasks.forEach(ct => add(ct[0], ct[1], ct[2], ct[3]));

        // 5. Günlük Pratik Alışkanlıklar & Mini Meydan Okumalar
        const habits = [
            ["Bugün alışveriş yaparken gereksiz tek bir ürün bile alma", "Tasarruf", 15, "Orta"],
            ["Gün sonunda cebindeki veya hesabındaki harcamaları 2 dakikada gözden geçir", "Tasarruf", 10, "Kolay"],
            ["Bugün çayını veya kahveni şekersiz içmeyi dene", "Sağlık", 15, "Orta"],
            ["Yemek yerken her lokmayı normalden daha yavaş çiğne", "Sağlık", 10, "Kolay"],
            ["Bugün bir arkadaşına komik bir video veya karikatür gönderip onu güldür", "Sosyal", 10, "Kolay"],
            ["Yarın yapacağın en önemli 3 işi şimdiden küçük bir nota yaz", "Planlama", 10, "Kolay"],
            ["Telefon galerindeki en sevdiğin anıya bakıp o günü hatırla", "Keyif", 10, "Kolay"],
            ["Bugün duruşunu (postürünü) dik tutmaya gün boyu özen göster", "Sağlık", 15, "Orta"],
            ["Ellerini ve yüzünü soğuk suyla yıkayıp 1 dakika derin nefes al", "Sağlık", 10, "Kolay"],
            ["Bugün sosyal medyada sadece takip ettiğin faydalı hesaplara göz at", "Farkındalık", 10, "Kolay"],
            ["Evdeki bir çekmeceyi veya rafı 5 dakikada baştan sona düzenle", "Düzen", 15, "Orta"],
            ["Bugün birine samimi bir teşekkür mesajı yaz", "Sosyal", 10, "Kolay"],
            ["Akşam güneş batarken 2 dakika gökyüzündeki renk değişimini izle", "Keyif", 10, "Kolay"],
            ["Bugün normalden 30 dakika daha erken yatağa girip uykunu al", "Sağlık", 20, "Zor"],
            ["Sabah uyandığında ilk 15 dakika telefona hiç dokunma", "Farkındalık", 20, "Zor"],
            ["Bugün tüm gün boyunca bol su içip enerjini yüksek tut", "Sağlık", 15, "Orta"],
            ["Kendi kendine küçük bir hedef koy ve gün bitmeden tamamla", "Motivasyon", 15, "Orta"],
            ["Bugün yeni bir kelime veya atasözü öğrenip sohbetinde kullan", "Kültür", 10, "Kolay"],
            ["Oturduğun yerden kalkıp 2 dakika boyunca kollarını ve sırtını esnet", "Spor", 10, "Kolay"],
            ["Bugün kendini mutlu edecek küçük bir ödül ver", "Keyif", 10, "Kolay"]
        ];
        habits.forEach(hb => add(hb[0], hb[1], hb[2], hb[3]));

        return pool;
    }

    const taskPool = generateBalancedTaskPool();

    // =========================================================================
    // 3. TÜM RÜTBE KADEMELERİ (DEMİR, BRONZ, GÜMÜŞ, ALTIN, ELMAS 1-5 + SİYAH ELMAS)
    // =========================================================================
    const ranks = [
        { name: "Demir I", tier: "Demir", max: 100, goldFrame: false },
        { name: "Demir II", tier: "Demir", max: 120, goldFrame: false },
        { name: "Demir III", tier: "Demir", max: 140, goldFrame: false },
        { name: "Demir IV", tier: "Demir", max: 160, goldFrame: false },
        { name: "Demir V", tier: "Demir", max: 180, goldFrame: true },

        { name: "Bronz I", tier: "Bronz", max: 200, goldFrame: false },
        { name: "Bronz II", tier: "Bronz", max: 230, goldFrame: false },
        { name: "Bronz III", tier: "Bronz", max: 260, goldFrame: false },
        { name: "Bronz IV", tier: "Bronz", max: 290, goldFrame: false },
        { name: "Bronz V", tier: "Bronz", max: 320, goldFrame: true },

        { name: "Gümüş I", tier: "Gümüş", max: 350, goldFrame: false },
        { name: "Gümüş II", tier: "Gümüş", max: 390, goldFrame: false },
        { name: "Gümüş III", tier: "Gümüş", max: 430, goldFrame: false },
        { name: "Gümüş IV", tier: "Gümüş", max: 470, goldFrame: false },
        { name: "Gümüş V", tier: "Gümüş", max: 520, goldFrame: true },

        { name: "Altın I", tier: "Altın", max: 580, goldFrame: false },
        { name: "Altın II", tier: "Altın", max: 640, goldFrame: false },
        { name: "Altın III", tier: "Altın", max: 700, goldFrame: false },
        { name: "Altın IV", tier: "Altın", max: 760, goldFrame: false },
        { name: "Altın V", tier: "Altın", max: 850, goldFrame: true },

        { name: "Elmas I", tier: "Elmas", max: 950, goldFrame: false },
        { name: "Elmas II", tier: "Elmas", max: 1050, goldFrame: false },
        { name: "Elmas III", tier: "Elmas", max: 1150, goldFrame: false },
        { name: "Elmas IV", tier: "Elmas", max: 1300, goldFrame: false },
        { name: "Elmas V", tier: "Elmas", max: 1500, goldFrame: true },

        { name: "Siyah Elmas", tier: "Siyah Elmas", max: 2500, goldFrame: true }
    ];

    // =========================================================================
    // 4. KALICI KAYIT SİSTEMİ (GÜNLÜK 1 GÖREV BAŞLANGICI & TEKRARSIZ HAVUZ)
    // =========================================================================
    function getTodayDateStr() {
        const d = new Date();
        return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    }

    function getTodayDayIndex() {
        let day = new Date().getDay();
        return day === 0 ? 6 : day - 1;
    }

    function getWeekKey() {
        const d = new Date();
        const diff = d.getDate() - getTodayDayIndex();
        const monday = new Date(d.setDate(diff));
        return `${monday.getFullYear()}-W${monday.getMonth() + 1}-${monday.getDate()}`;
    }

    let state = {
        xp: 0,
        rankLevel: 1,
        weekKey: getWeekKey(),
        dailyCompletedCounts: [0, 0, 0, 0, 0, 0, 0],
        weeklyMergedDone: false,
        todayDate: getTodayDateStr(),
        usedTaskIdsToday: [],
        activeTasks: [],
        notifications: ["09:00", "14:00", "20:00"],
        lastNotifSent: {}
    };

    function loadState() {
        const saved = localStorage.getItem("pixelquest_save_v5");
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                state.xp = parsed.xp || 0;
                state.rankLevel = parsed.rankLevel || 1;
                state.notifications = parsed.notifications || ["09:00", "14:00", "20:00"];
                state.lastNotifSent = parsed.lastNotifSent || {};

                if (parsed.weekKey === getWeekKey()) {
                    state.weekKey = parsed.weekKey;
                    state.dailyCompletedCounts = parsed.dailyCompletedCounts || [0, 0, 0, 0, 0, 0, 0];
                    state.weeklyMergedDone = parsed.weeklyMergedDone || false;
                } else {
                    state.weekKey = getWeekKey();
                    state.dailyCompletedCounts = [0, 0, 0, 0, 0, 0, 0];
                    state.weeklyMergedDone = false;
                }

                if (parsed.todayDate === getTodayDateStr()) {
                    state.todayDate = parsed.todayDate;
                    state.usedTaskIdsToday = parsed.usedTaskIdsToday || [];
                    state.activeTasks = (parsed.activeTasks || []).map(t => ({ ...t, pending: false, timer: null }));
                } else {
                    state.todayDate = getTodayDateStr();
                    state.usedTaskIdsToday = [];
                    state.activeTasks = [];
                }
            } catch (e) {
                console.error(e);
            }
        }

        // Günlük otomatik olarak SADECE 1 TANE görev verir (İstenirse artı ile artırılır)
        if (state.activeTasks.length === 0) {
            state.activeTasks = pullUniqueTasks(1);
            saveState();
        }
    }

    function saveState() {
        const toSave = {
            xp: state.xp,
            rankLevel: state.rankLevel,
            weekKey: state.weekKey,
            dailyCompletedCounts: state.dailyCompletedCounts,
            weeklyMergedDone: state.weeklyMergedDone,
            todayDate: state.todayDate,
            usedTaskIdsToday: state.usedTaskIdsToday,
            activeTasks: state.activeTasks.map(t => ({
                poolId: t.poolId,
                text: t.text,
                cat: t.cat,
                xp: t.xp,
                diff: t.diff,
                completed: t.completed
            })),
            notifications: state.notifications,
            lastNotifSent: state.lastNotifSent
        };
        localStorage.setItem("pixelquest_save_v5", JSON.stringify(toSave));
    }

    function pullUniqueTasks(count = 1) {
        let available = taskPool.filter(t => !state.usedTaskIdsToday.includes(t.poolId));
        if (available.length === 0) return [];

        let selected = [];
        for (let i = 0; i < count; i++) {
            if (available.length === 0) break;
            let randIdx = Math.floor(Math.random() * available.length);
            let chosen = available[randIdx];
            state.usedTaskIdsToday.push(chosen.poolId);
            selected.push({
                ...chosen,
                completed: false,
                pending: false,
                timer: null
            });
            available.splice(randIdx, 1);
        }
        return selected;
    }

    // =========================================================================
    // 5. ARAYÜZ GÜNCELLEME & ANİMASYON MANTIĞI
    // =========================================================================
    function updateUI() {
        let rank = ranks[state.rankLevel - 1] || ranks[ranks.length - 1];
        document.getElementById("rank-title").innerText = rank.name;
        document.getElementById("current-xp").innerText = state.xp;
        document.getElementById("max-xp").innerText = rank.max;
        
        let percent = Math.min(100, (state.xp / rank.max) * 100);
        document.getElementById("xp-fill").style.width = percent + "%";

        let badge = document.getElementById("rank-badge-icon");
        badge.innerHTML = getRankShieldSVG(rank.tier);
        if (rank.goldFrame) badge.classList.add("gold-frame");
        else badge.classList.remove("gold-frame");

        // Haftalık Seri Render
        const weeklyContainer = document.getElementById("weekly-container");
        const days = ["Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"];
        const allSevenDaysCompleted = state.dailyCompletedCounts.every(c => c > 0);

        if (allSevenDaysCompleted && state.weeklyMergedDone) {
            weeklyContainer.classList.add("weekly-grand-merged");
            weeklyContainer.innerHTML = `
                <div class="center-pixel-star" style="width:44px; height:44px;">
                    ${getPixelStarSVG("grand_weekly", 44)}
                </div>
            `;
        } else {
            weeklyContainer.classList.remove("weekly-grand-merged");
            let weeklyHTML = "";
            for (let i = 0; i < 7; i++) {
                let count = state.dailyCompletedCounts[i];
                let starHTML = `<span style="color:#444;">·</span>`;
                if (count === 1) {
                    starHTML = getPixelStarSVG("gold", 20);
                } else if (count === 2) {
                    starHTML = getPixelStarSVG("bright", 20);
                } else if (count >= 3) {
                    starHTML = getPixelStarSVG("diamond", 20);
                }

                weeklyHTML += `
                    <div class="day-box ${count > 0 ? 'has-star' : ''}">
                        <span>${days[i]}</span>
                        <div class="day-star-slot">${starHTML}</div>
                    </div>
                `;
            }
            weeklyContainer.innerHTML = weeklyHTML;
        }

        // Görev Kartları Render
        let tasksHTML = "";
        state.activeTasks.forEach((t, idx) => {
            if (t.completed) {
                tasksHTML += `
                    <div class="task-card completed">
                        <div class="center-pixel-star">
                            ${getPixelStarSVG("red_core", 36)}
                        </div>
                    </div>
                `;
            } else if (t.pending) {
                tasksHTML += `
                    <div class="task-card pending-confirm">
                        <div class="confirm-box">
                            <div class="confirm-top">
                                <span>Onay bekleniyor...</span>
                                <button class="confirm-btn" onclick="confirmTask(${idx})">TAMAMLA</button>
                            </div>
                            <div class="countdown-bar">
                                <div class="countdown-fill" id="cd-${idx}"></div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                tasksHTML += `
                    <div class="task-card" onclick="startTaskPending(${idx})">
                        <div class="task-info">
                            <h4>${t.text}</h4>
                            <div class="meta"><span>${t.cat}</span> • <span>${t.diff}</span></div>
                        </div>
                        <div class="task-xp">+${t.xp} XP</div>
                    </div>
                `;
            }
        });
        document.getElementById("tasks-list").innerHTML = tasksHTML;

        state.activeTasks.forEach((t, idx) => {
            if (t.pending) {
                setTimeout(() => {
                    let fill = document.getElementById(`cd-${idx}`);
                    if (fill) fill.style.width = "0%";
                }, 50);
            }
        });
    }

    function startTaskPending(idx) {
        let t = state.activeTasks[idx];
        if (t.completed || t.pending) return;

        t.pending = true;
        updateUI();

        t.timer = setTimeout(() => {
            if (t.pending && !t.completed) {
                t.pending = false;
                updateUI();
            }
        }, 5000);
    }

    function confirmTask(idx) {
        let t = state.activeTasks[idx];
        if (!t.pending) return;

        clearTimeout(t.timer);
        t.pending = false;

        const cards = document.querySelectorAll('.task-card');
        const cardEl = cards[idx];
        if (cardEl) {
            cardEl.innerHTML = `
                <div class="gold-spread-bg"></div>
                <div class="merging-star-left anim-merge-left">${getPixelStarSVG("gold", 30)}</div>
                <div class="merging-star-right anim-merge-right">${getPixelStarSVG("gold", 30)}</div>
            `;
        }

        setTimeout(() => {
            t.completed = true;

            let todayIdx = getTodayDayIndex();
            state.dailyCompletedCounts[todayIdx] = (state.dailyCompletedCounts[todayIdx] || 0) + 1;

            state.xp += t.xp;
            let currentRankMax = ranks[state.rankLevel - 1].max;
            if (state.xp >= currentRankMax) {
                state.xp -= currentRankMax;
                state.rankLevel = Math.min(ranks.length, state.rankLevel + 1);
                triggerRankShake();
            }

            if (state.dailyCompletedCounts.every(c => c > 0) && !state.weeklyMergedDone) {
                state.weeklyMergedDone = true;
            }

            saveState();
            updateUI();
        }, 1250);
    }

    function triggerRankShake() {
        let badge = document.getElementById("rank-badge-icon");
        badge.classList.add("shake-animation");
        setTimeout(() => badge.classList.remove("shake-animation"), 900);
    }

    // =========================================================================
    // KARE ARTI BUTONUNUN DİKDÖRTGEN GÖREV ÇERÇEVESİNE BÜYÜYÜP
    // ORTADAN İKİYE AÇILARAK İÇİNDEN GÖREV ÇIKARMASI ANİMASYONU
    // =========================================================================
    function addNewTaskWithMorph(btn) {
        if (btn.classList.contains("expanding")) return;

        let newTasks = pullUniqueTasks(1);
        if (newTasks.length === 0) return;
        let nextTask = newTasks[0];

        // İçinden çıkacak görevi önizleme alanına yerleştir
        const previewEl = document.getElementById("emerging-preview");
        previewEl.innerHTML = `
            <div class="task-info">
                <h4>${nextTask.text}</h4>
                <div class="meta"><span>${nextTask.cat}</span> • <span>${nextTask.diff}</span></div>
            </div>
            <div class="task-xp">+${nextTask.xp} XP</div>
        `;

        // Kareyi görev kartı boyutunda dikdörtgene büyüt ve artıyı sağa/sola ayır
        btn.classList.add("expanding");

        // Animasyon tamamlandığında görevi gerçek listeye ekle ve butonu eski kare haline döndür
        setTimeout(() => {
            state.activeTasks.push(nextTask);
            saveState();
            updateUI();

            // Butonu sıfırla
            btn.style.transition = "none";
            btn.classList.remove("expanding");
            previewEl.innerHTML = "";
            void btn.offsetWidth; // Reflow tetikle
            btn.style.transition = "";
        }, 1150);
    }

    // Rütbe Listesi Modalı
    function toggleRankModal(show) {
        let modal = document.getElementById("rank-modal");
        if (show) {
            let html = "";
            ranks.forEach((r, idx) => {
                let isCurrent = (idx + 1 === state.rankLevel);
                html += `
                    <div class="rank-list-item ${isCurrent ? 'current' : ''}">
                        <div style="display:flex; align-items:center; gap:8px;">
                            ${getRankShieldSVG(r.tier)}
                            <span>${r.name}</span>
                        </div>
                        <span>${isCurrent ? '★ MEVCUT' : r.max + ' XP'}</span>
                    </div>
                `;
            });
            document.getElementById("rank-list-container").innerHTML = html;
            modal.classList.add("active");
        } else {
            modal.classList.remove("active");
        }
    }

    // Ayarlar Modalı
    function toggleSettingsModal(show) {
        let modal = document.getElementById("settings-modal");
        if (show) {
            document.getElementById("notif-1").value = state.notifications[0] || "09:00";
            document.getElementById("notif-2").value = state.notifications[1] || "14:00";
            document.getElementById("notif-3").value = state.notifications[2] || "20:00";
            modal.classList.add("active");
        } else {
            modal.classList.remove("active");
        }
    }

    function saveSettings() {
        let t1 = document.getElementById("notif-1").value;
        let t2 = document.getElementById("notif-2").value;
        let t3 = document.getElementById("notif-3").value;
        state.notifications = [t1, t2, t3];
        saveState();

        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }
        toggleSettingsModal(false);
    }

    function checkNotifications() {
        const now = new Date();
        const hhmm = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');
        const today = getTodayDateStr();

        state.notifications.forEach((timeStr, idx) => {
            const key = `${today}_${idx}_${timeStr}`;
            if (hhmm === timeStr && !state.lastNotifSent[key]) {
                state.lastNotifSent[key] = true;
                saveState();
                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification("PixelQuest Görev Hatırlatıcısı", {
                        body: "Günlük görevini tamamlayıp yıldızını toplamayı ve rütbe atlamayı unutma!",
                        icon: "icon.png"
                    });
                }
            }
        });
    }
    setInterval(checkNotifications, 15000);

    // =========================================================================
    // 6. DİNAMİK SAATLİ ARKA PLAN (AYNEN KORUNDU)
    // =========================================================================
    const canvas = document.getElementById("bg-canvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let cloudOffset = 0;
    let trainPos = 0;

    function drawAnimatedBackground() {
        let now = new Date();
        let hour = now.getHours();
        let minute = now.getMinutes();
        document.getElementById("time-display").innerText = String(hour).padStart(2, '0') + ":" + String(minute).padStart(2, '0');

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let w = canvas.width;
        let h = canvas.height;

        cloudOffset += 0.2;
        if (cloudOffset > w) cloudOffset = 0;

        trainPos += 1.5;
        if (trainPos > w + 100) trainPos = -100;

        if (hour >= 7 && hour < 13) {
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, "#4facfe");
            grad.addColorStop(1, "#00f2fe");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = "#fffacd";
            ctx.beginPath();
            ctx.arc(w * 0.75, h * 0.3, 35, 0, Math.PI * 2);
            ctx.fill();

            drawBuildings(["#203a43", "#2c5364", "#1a2530"]);
        } else if (hour >= 13 && hour < 19) {
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, "#2980b9");
            grad.addColorStop(1, "#6dd5fa");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.fillRect((w * 0.1 + cloudOffset) % (w + 100) - 50, h * 0.15, 90, 22);
            ctx.fillRect((w * 0.6 + cloudOffset * 0.7) % (w + 100) - 50, h * 0.28, 110, 26);

            drawBuildings(["#1b4f72", "#154360", "#0e3a50"]);
        } else if (hour >= 19 && hour < 21) {
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, "#cb356b");
            grad.addColorStop(1, "#bd3f32");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = "#f39c12";
            ctx.beginPath();
            ctx.arc(w * 0.5, h * 0.4, 40, 0, Math.PI * 2);
            ctx.fill();

            drawBuildings(["#4a1525", "#3a101b", "#250810"]);

            ctx.fillStyle = "#f1c40f";
            ctx.fillRect(trainPos, h - 85, 80, 16);
            ctx.fillStyle = "#333";
            ctx.fillRect(trainPos + 10, h - 83, 14, 10);
            ctx.fillRect(trainPos + 35, h - 83, 14, 10);
            ctx.fillRect(trainPos + 60, h - 83, 14, 10);
        } else {
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, "#09122c");
            grad.addColorStop(1, "#181c3d");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = "#ffffff";
            for (let i = 0; i < 45; i++) {
                let sx = (i * 41) % w;
                let sy = (i * 27) % (h * 0.65);
                ctx.fillRect(sx, sy, 2, 2);
            }

            drawBuildings(["#0f172a", "#1e293b", "#0b0f19"]);
        }

        requestAnimationFrame(drawAnimatedBackground);
    }

    function drawBuildings(colors) {
        let w = canvas.width;
        let h = canvas.height;
        let bWidth = 42;
        let count = Math.ceil(w / bWidth) + 1;

        for (let i = 0; i < count; i++) {
            let bH = 130 + ((i * 47) % 170);
            let x = i * (bWidth - 2);
            let y = h - bH;

            ctx.fillStyle = colors[i % colors.length];
            ctx.fillRect(x, y, bWidth, bH);

            ctx.fillStyle = "rgba(255, 255, 200, 0.65)";
            for (let wx = x + 6; wx < x + bWidth - 6; wx += 10) {
                for (let wy = y + 12; wy < h - 10; wy += 18) {
                    if ((i + wx + wy) % 3 !== 0) {
                        ctx.fillRect(wx, wy, 5, 8);
                    }
                }
            }
        }
    }

    window.onload = () => {
        loadState();
        updateUI();
        resizeCanvas();
        requestAnimationFrame(drawAnimatedBackground);

        setTimeout(() => {
            let splash = document.getElementById("splash-screen");
            splash.classList.add("zoom-out");
        }, 2400);
    };
</script>
