<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixelQuest</title>
    <link rel="icon" href="icon.png" type="image/png">
    <style>
        /* Yüksek Çözünürlüklü Piksel Tasarım & Tema Ayarları */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
            image-rendering: pixelated;
        }
        body {
            background-color: #0b0b0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }
        .phone-frame {
            width: 100vw;
            height: 100vh;
            max-width: 430px;
            max-height: 890px;
            background: #000;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
        }
        @media(min-width: 440px) {
            .phone-frame {
                border: 6px solid #2b2b36;
                box-shadow: 0 0 0 4px #14141c, 0 0 40px rgba(0,0,0,0.9);
                height: 850px;
            }
        }
        
        /* Dinamik Animasyonlu Canvas Arka Plan (Aynen Korundu) */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Arayüz Katmanı - Yüksek Çözünürlüklü Piksel Çerçeveler */
        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: rgba(10, 10, 15, 0.28);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            overflow-y: auto;
            padding: 16px;
        }
        .app-container::-webkit-scrollbar {
            width: 6px;
        }
        .app-container::-webkit-scrollbar-thumb {
            background: rgba(255,215,0,0.4);
            border: 1px solid #000;
        }

        /* Piksel Kutular İçin Ortak Sınıf */
        .pixel-box {
            background: rgba(20, 22, 34, 0.85);
            border: 3px solid #444860;
            box-shadow: 
                inset 2px 2px 0px rgba(255, 255, 255, 0.15),
                inset -2px -2px 0px rgba(0, 0, 0, 0.6),
                0 4px 0px rgba(0, 0, 0, 0.5);
        }

        /* Header / Rütbe Barı */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            margin-bottom: 14px;
        }
        .rank-info {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .rank-badge {
            width: 46px;
            height: 46px;
            background: #141622;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid #666;
            box-shadow: inset 2px 2px 0px rgba(255,255,255,0.2), inset -2px -2px 0px rgba(0,0,0,0.8);
            position: relative;
            transition: transform 0.2s;
        }
        .rank-badge.gold-frame {
            border-color: #ffd700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.6), inset 2px 2px 0px #fff8b0;
        }
        .rank-text h3 {
            font-size: 14px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 2px 2px 0px #000;
            letter-spacing: 0.5px;
        }
        .rank-text p {
            font-size: 11px;
            color: #ddd;
            text-shadow: 1px 1px 0px #000;
        }
        .xp-bar-container {
            width: 100px;
            background: #0d0e14;
            height: 10px;
            margin-top: 4px;
            border: 2px solid #555;
            padding: 1px;
        }
        .xp-bar-fill {
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                #4facfe,
                #4facfe 4px,
                #00f2fe 4px,
                #00f2fe 8px
            );
            width: 0%;
            transition: width 0.6s ease;
        }

        /* Ayarlar İkonu */
        .settings-btn {
            background: #23263a;
            border: 3px solid #585d7a;
            box-shadow: inset 2px 2px 0px rgba(255,255,255,0.2), inset -2px -2px 0px rgba(0,0,0,0.7);
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .settings-btn:active {
            transform: translateY(2px);
        }

        /* Haftalık Seri Barı */
        .weekly-series {
            padding: 12px 10px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            transition: all 1s ease;
        }
        .weekly-series.weekly-grand-merged {
            background: #ffd700 !important;
            border-color: #fff8b0 !important;
            box-shadow: 0 0 25px #ffd700, inset 3px 3px 0px #fff;
            justify-content: center !important;
            min-height: 68px;
        }
        .day-box {
            width: 40px;
            height: 48px;
            background: #12131c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
            border: 2px solid #383b4d;
            color: #888;
            transition: all 0.5s ease;
        }
        .day-box.has-star {
            border-color: #ffd700;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.12);
        }
        .day-star-slot {
            width: 20px;
            height: 20px;
            margin-top: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Bölüm Başlığı */
        .section-title {
            font-size: 12px;
            color: #ffd700;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
        }

        /* Görev Listesi */
        .tasks-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        /* Görev Kartı (Yüksek Kaliteli Piksel Çerçeve) */
        .task-card {
            background: rgba(24, 26, 42, 0.85);
            border: 3px solid #4d5270;
            box-shadow: 
                inset 2px 2px 0px rgba(255, 255, 255, 0.15),
                inset -2px -2px 0px rgba(0, 0, 0, 0.7),
                0 4px 0px rgba(0, 0, 0, 0.5);
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: border-color 0.3s, background-color 0.3s;
            position: relative;
            overflow: hidden;
            min-height: 64px;
        }
        .task-card:hover {
            border-color: #828ab8;
        }
        .task-info h4 {
            font-size: 13px;
            color: #fff;
            margin-bottom: 5px;
            font-weight: bold;
            line-height: 1.3;
            text-shadow: 1px 1px 0px #000;
        }
        .task-info .meta {
            font-size: 10px;
            color: #aeb4d4;
            display: flex;
            gap: 8px;
        }
        .task-xp {
            background: #2b2410;
            color: #ffd700;
            padding: 5px 8px;
            font-size: 11px;
            font-weight: bold;
            border: 2px solid #b8860b;
            text-shadow: 1px 1px 0px #000;
            white-space: nowrap;
        }

        /* Yavaşça Yayılan Altın Sarısı Arka Plan Efekti */
        .gold-spread-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: #ffd700;
            transform: translate(-50%, -50%) scale(0);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
            animation: slowGoldSpread 1.4s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes slowGoldSpread {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0.7; }
            100% { transform: translate(-50%, -50%) scale(45); opacity: 1; }
        }

        /* Tamamlanmış Görev Kartı */
        .task-card.completed {
            background: #ffd700 !important;
            border-color: #fff4a3 !important;
            box-shadow: inset 3px 3px 0px #fff, inset -3px -3px 0px #b8860b, 0 0 20px rgba(255, 215, 0, 0.7) !important;
            justify-content: center !important;
            cursor: default;
        }
        .task-card.completed .task-info,
        .task-card.completed .task-xp {
            display: none !important;
        }

        /* Görev Tamamlanırken Sağdan ve Soldan Yavaşça Gelip Ortada Birleşen Piksel Yıldızlar */
        .merging-star-left, .merging-star-right {
            position: absolute;
            top: 50%;
            width: 28px;
            height: 28px;
            z-index: 5;
            pointer-events: none;
            transform: translateY(-50%);
        }
        @keyframes slowMergeLeft {
            0% { left: 10px; transform: translateY(-50%) scale(0.7) rotate(0deg); opacity: 0.4; }
            60% { left: calc(50% - 26px); transform: translateY(-50%) scale(1.05) rotate(180deg); opacity: 1; }
            100% { left: calc(50% - 14px); transform: translateY(-50%) scale(1.1) rotate(360deg); opacity: 0; }
        }
        @keyframes slowMergeRight {
            0% { right: 10px; transform: translateY(-50%) scale(0.7) rotate(0deg); opacity: 0.4; }
            60% { right: calc(50% - 26px); transform: translateY(-50%) scale(1.05) rotate(-180deg); opacity: 1; }
            100% { right: calc(50% - 14px); transform: translateY(-50%) scale(1.1) rotate(-360deg); opacity: 0; }
        }
        .anim-merge-left {
            animation: slowMergeLeft 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .anim-merge-right {
            animation: slowMergeRight 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Ortada Beliren Kırmızı Çekirdekli Piksel Yıldız */
        .center-pixel-star {
            position: relative;
            z-index: 6;
            width: 34px;
            height: 34px;
            animation: centerStarAppear 0.8s ease-out forwards, starIdleFloat 2s infinite alternate ease-in-out 0.8s;
        }
        @keyframes centerStarAppear {
            0% { transform: scale(0.2); opacity: 0; }
            60% { transform: scale(1.25); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes starIdleFloat {
            0% { transform: scale(1); }
            100% { transform: scale(1.12); }
        }

        /* 5 Saniye Onay / Tamamlama Modu */
        .task-card.pending-confirm {
            border-color: #ffd700;
            background: rgba(45, 40, 20, 0.92);
        }
        .confirm-box {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 8px;
        }
        .confirm-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .confirm-top span {
            font-size: 12px;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 1px 1px 0px #000;
        }
        .confirm-btn {
            background: #ffd700;
            color: #000;
            border: 2px solid #fff;
            box-shadow: inset -2px -2px 0px #b8860b;
            padding: 6px 14px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }
        .countdown-bar {
            width: 100%;
            height: 6px;
            background: #111;
            border: 1px solid #555;
        }
        .countdown-fill {
            height: 100%;
            background: #ffd700;
            width: 100%;
            transition: width 5s linear;
        }

        /* Yeni Görev İsteme: Yavaşça Büyüyüp Sağa Sola Açılan Piksel Artı Butonu */
        .add-task-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            position: relative;
        }
        .big-plus-btn {
            width: 62px;
            height: 62px;
            background: #222538;
            border: 3px solid #ffd700;
            box-shadow: inset 2px 2px 0px rgba(255,255,255,0.25), inset -2px -2px 0px rgba(0,0,0,0.8), 0 4px 0px #000;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        .big-plus-btn:hover {
            transform: scale(1.06);
        }
        .plus-half-left, .plus-half-right {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 1.1s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.1s ease;
        }
        .plus-half-left {
            clip-path: inset(0 50% 0 0);
        }
        .plus-half-right {
            clip-path: inset(0 0 0 50%);
        }
        /* Tıklanınca Önce Büyüyüp Sonra Yavaşça Sağa Sola Açılma Animasyonu */
        .big-plus-btn.splitting {
            animation: plusGrowSlow 1.1s ease forwards;
        }
        @keyframes plusGrowSlow {
            0% { transform: scale(1); }
            35% { transform: scale(1.22); }
            100% { transform: scale(1); }
        }
        .big-plus-btn.splitting .plus-half-left {
            transform: translateX(-28px) scale(1.15);
            opacity: 0;
        }
        .big-plus-btn.splitting .plus-half-right {
            transform: translateX(28px) scale(1.15);
            opacity: 0;
        }

        /* Modallar (Rütbe Listesi & Ayarlar) */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 250;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: #1a1c2b;
            border: 4px solid #ffd700;
            box-shadow: inset 3px 3px 0px rgba(255,255,255,0.2), inset -3px -3px 0px rgba(0,0,0,0.8);
            padding: 18px;
            width: 90%;
            max-width: 360px;
            max-height: 82vh;
            overflow-y: auto;
        }
        .modal-card h2 {
            color: #ffd700;
            font-size: 15px;
            text-align: center;
            margin-bottom: 14px;
            text-shadow: 2px 2px 0px #000;
            letter-spacing: 1px;
        }
        .rank-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 2px solid #2b2e42;
            font-size: 12px;
        }
        .rank-list-item.current {
            background: rgba(255, 215, 0, 0.18);
            border: 2px solid #ffd700;
            color: #ffd700;
            font-weight: bold;
        }
        .close-modal-btn {
            width: 100%;
            margin-top: 14px;
            background: #ffd700;
            color: #000;
            border: 2px solid #fff;
            box-shadow: inset -2px -2px 0px #b8860b;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        /* Rütbe Atlama Titreme Efekti */
        @keyframes rankShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-5px, 2px) rotate(-4deg); }
            40% { transform: translate(5px, -2px) rotate(4deg); }
            60% { transform: translate(-5px, -2px) rotate(-3deg); }
            80% { transform: translate(5px, 2px) rotate(3deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .shake-animation {
            animation: rankShake 0.8s ease-in-out;
        }

        /* Ayarlar Formu */
        .settings-group {
            margin-bottom: 12px;
        }
        .settings-group label {
            font-size: 11px;
            color: #ccc;
            display: block;
            margin-bottom: 4px;
        }
        .settings-group input {
            width: 100%;
            background: #0f101a;
            border: 2px solid #4d5270;
            padding: 8px;
            color: #fff;
            font-family: inherit;
            font-size: 12px;
        }

        /* Yavaş ve Profesyonel Açılış Animasyonu (Uygulama İkonu ile Birebir Uyumlu) */
        #splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0e0e18;
            z-index: 400;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            overflow: hidden;
            transition: opacity 1.3s cubic-bezier(0.25, 1, 0.5, 1), transform 1.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #splash-screen.zoom-out {
            opacity: 0;
            transform: scale(6);
            pointer-events: none;
        }
        .splash-icon-img {
            width: 96px;
            height: 96px;
            image-rendering: pixelated;
            animation: splashBreath 1.4s infinite alternate ease-in-out;
        }
        @keyframes splashBreath {
            0% { transform: scale(0.95); filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.4)); }
            100% { transform: scale(1.08); filter: drop-shadow(0 0 28px rgba(255, 215, 0, 0.85)); }
        }
        .splash-label {
            color: #ffd700;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 2px 2px 0px #000;
        }
    </style>
</head>
<body>

<div class="phone-frame">
    <!-- Yavaş Açılış Ekranı: Uygulama İkonu ile Birebir Aynı Yıldız -->
    <div id="splash-screen">
        <img src="icon.png" alt="PixelQuest" class="splash-icon-img" onerror="this.style.display='none'">
        <div id="splash-svg-fallback"></div>
        <div class="splash-label">PIXELQUEST</div>
    </div>

    <!-- Rütbe Listesi Modalı -->
    <div class="modal-overlay" id="rank-modal">
        <div class="modal-card">
            <h2>🏆 RÜTBE KADEMELERİ</h2>
            <div id="rank-list-container"></div>
            <button class="close-modal-btn" onclick="toggleRankModal(false)">KAPAT</button>
        </div>
    </div>

    <!-- Ayarlar Modalı -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-card">
            <h2>⚙️ BİLDİRİM AYARLARI</h2>
            <p style="font-size:11px; color:#bbb; margin-bottom:12px;">Günlük 3 bildirim zamanını ayarlayın:</p>
            <div class="settings-group">
                <label>1. Bildirim (Sabah)</label>
                <input type="time" id="notif-1" value="09:00">
            </div>
            <div class="settings-group">
                <label>2. Bildirim (Öğleden Sonra)</label>
                <input type="time" id="notif-2" value="14:00">
            </div>
            <div class="settings-group">
                <label>3. Bildirim (Akşam)</label>
                <input type="time" id="notif-3" value="20:00">
            </div>
            <button class="close-modal-btn" onclick="saveSettings()">KAYDET & AKTİFLEŞTİR</button>
        </div>
    </div>

    <!-- Animasyonlu Kanvas Arka Plan (Aynen Korundu) -->
    <canvas id="bg-canvas"></canvas>

    <!-- Uygulama Arayüzü -->
    <div class="app-container">
        <!-- Header -->
        <div class="header pixel-box">
            <div class="rank-info" onclick="toggleRankModal(true)">
                <div class="rank-badge" id="rank-badge-icon"></div>
                <div class="rank-text">
                    <h3 id="rank-title">Demir I</h3>
                    <p><span id="current-xp">0</span> / <span id="max-xp">100</span> XP</p>
                    <div class="xp-bar-container">
                        <div class="xp-bar-fill" id="xp-fill"></div>
                    </div>
                </div>
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
                <div style="font-size: 11px; color: #ddd; text-shadow: 1px 1px 0 #000;" id="time-display">07:00</div>
                <button class="settings-btn" onclick="toggleSettingsModal(true)" title="Ayarlar">
                    <svg width="20" height="20" viewBox="0 0 16 16" shape-rendering="crispEdges">
                        <path fill="#ffd700" d="M6 1h4v2h2l1-1 2 2-1 1v2h2v4h-2v2l1 1-2 2-1-1h-2v2H6v-2H4l-1 1-2-2 1-1v-2H0V6h2V4L1 3l2-2 1 1h2V1zm1 5v4h2V6H7z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Haftalık Seri (Görev Yapılan Günlere Göre Yıldız Seviyesi & Pazar Birleşimi) -->
        <div class="weekly-series pixel-box" id="weekly-container"></div>

        <!-- Görevler -->
        <div class="section-title">Günlük Görev Havuzu</div>
        <div class="tasks-container" id="tasks-list"></div>

        <!-- Yeni Görev İsteme: Yavaş Büyüyüp Sağa Sola Açılan Piksel Artı -->
        <div class="add-task-container">
            <div class="big-plus-btn" id="plus-btn" onclick="addNewTaskWithAnimation(this)">
                <div class="plus-half-left">
                    <svg width="28" height="28" viewBox="0 0 16 16" shape-rendering="crispEdges">
                        <path fill="#ffd700" d="M7 2h2v5h5v2H9v5H7V9H2V7h5V2z"/>
                    </svg>
                </div>
                <div class="plus-half-right">
                    <svg width="28" height="28" viewBox="0 0 16 16" shape-rendering="crispEdges">
                        <path fill="#ffd700" d="M7 2h2v5h5v2H9v5H7V9H2V7h5V2z"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // =========================================================================
    // 1. YÜKSEK ÇÖZÜNÜRLÜKLÜ PİKSEL SVG İKON ÜRETİCİLERİ
    // =========================================================================
    
    // Rütbe Kalkanı Piksel SVG (Rütbe Rengine Göre Değişir)
    function getRankShieldSVG(tier) {
        const palettes = {
            "Demir": { border: "#4a4e58", main: "#8c92a4", light: "#c5cbd8", core: "#5c6273" },
            "Bronz": { border: "#5c3317", main: "#cd7f32", light: "#e8a864", core: "#8b4513" },

    // =========================================================================
    // 2. 1000+ BENZERSİZ GÖREV HAVUZU (GÜN İÇİNDE ASLA TEKRAR ETMEZ)
    // =========================================================================
    function generateMassiveTaskPool() {
        const templates = [
            { cat: "Spor", diff: "Kolay", xp: 10, items: [
                "{n} dakika tempolu yürüyüş yap", "{n} adet şınav çek", "{n} adet mekik çek",
                "{n} adet squat (çökme) yap", "{n} dakika esneme ve mobilite çalış",
                "{n} dakika ip atla", "{n} saniye plank pozisyonunda dur",
                "Merdivenleri kullanarak {n} kat çık", "{n} dakika boyun ve omuz egzersizi yap"
            ]},
            { cat: "Kişisel Gelişim", diff: "Orta", xp: 15, items: [
                "Kitabından en az {n} sayfa oku", "Yeni {n} adet yabancı dil kelimesi ezberle",
                "{n} dakika boyunca derin odaklanma ile çalış", "Günlük hedeflerinden {n} tanesini yazıya dök",
                "{n} dakika meditasyon ve nefes egzersizi yap", "Eğitici bir belgesel veya ders videosundan {n} dakika izle",
                "Telefon ekranına bakmadan {n} dakika geçir", "Çalışma masandaki {n} gereksiz eşyayı düzenle"
            ]},
            { cat: "Sağlık & Beslenme", diff: "Kolay", xp: 10, items: [
                "Bugün en az {n} bardak su iç", "Şekersiz ve işlenmemiş gıdalarla {n} öğün geçir",
                "Gözlerini dinlendirmek için {n} dakika uzağa odaklan", "Sabah uyandıktan sonra {n} dakika içinde yatağını topla",
                "Yatmadan {n} dakika önce mavi ışık ekranlarını kapat", "Güneş ışığında açık havada {n} dakika nefes al"
            ]},
            { cat: "Sosyal & İletişim", diff: "Orta", xp: 15, items: [
                "Uzun zamandır konuşmadığın {n} arkadaşına hal hatır sor", "Ailenden {n} kişiye teşekkür et veya güzel bir söz söyle",
                "Bugün tanıştığın veya gördüğün {n} kişiye içtenlikle gülümse", "Bir arkadaşına faydalı olabilecek {n} bilgi veya kitap öner"
            ]},
            { cat: "Zorlu Meydan Okuma", diff: "Zor", xp: 25, items: [
                "Toplam {n} dakika kesintisiz koşu veya kardiyo yap", "Bugün sosyal medyada en fazla {n} dakika vakit geçir",
                "{n} sayfa teknik veya geliştirici makale oku", "Soğuk duş altında en az {n} saniye kal",
                "Tüm gün boyunca şikayet etmeden {n} saat geçir"
            ]}
        ];

        const numbers = [5, 10, 12, 15, 20, 25, 30, 35, 40, 45, 50, 60];
        let pool = [];
        let idCounter = 1;

        // Kombinasyonlarla 1100+ benzersiz görev oluştur
        templates.forEach(group => {
            group.items.forEach(template => {
                numbers.forEach(num => {
                    // Mantıklı sayı filtrelemesi
                    if (template.includes("kat çık") && num > 15) return;
                    if (template.includes("öğün") && num > 3) return;
                    if (template.includes("arkadaşına") && num > 5) return;
                    if (template.includes("kişiye") && num > 5) return;
                    if (template.includes("bilgi") && num > 3) return;
                    if (template.includes("bardak su") && (num < 6 || num > 15)) return;
                    if (template.includes("saat geçir") && (num < 6 || num > 24)) return;

                    let text = template.replace("{n}", num);
                    pool.push({
                        poolId: "task_" + (idCounter++),
                        text: text,
                        cat: group.cat,
                        xp: group.xp,
                        diff: group.diff
                    });
                });
            });
        });

        // Ekstra özel görevler ekleyerek 1000+ barajını rahatça geç
        const extraTopics = ["Tarih", "Bilim", "Sanat", "Felsefe", "Ekonomi", "Psikoloji", "Teknoloji", "Coğrafya", "Astronomi", "Edebiyat"];
        const extraActions = [
            "hakkında 10 dakikalık bir araştırma yap",
            "alanında yeni bir kavram öğren ve not al",
            "konusunda kısa bir özet çıkar",
            "ile ilgili belgesel kesiti izle",
            "üzerine 5 dakika düşün ve fikir üret"
        ];
        for (let i = 1; i <= 40; i++) {
            extraTopics.forEach(topic => {
                extraActions.forEach(act => {
                    pool.push({
                        poolId: "extra_" + (idCounter++),
                        text: `${topic} (${i}. Seviye) ${act}`,
                        cat: "Kişisel Gelişim",
                        xp: 15,
                        diff: "Orta"
                    });
                });
            });
        }
        return pool;
    }

    const taskPool = generateMassiveTaskPool(); // 1500+ benzersiz görev

    // =========================================================================

    // =========================================================================
    // 4. KALICI KAYIT SİSTEMİ (RÜTBE HİÇBİR ZAMAN SIFIRLANMAZ, GÜNLÜK TEKRAR YOK)
    // =========================================================================
    function getTodayDateStr() {
        const d = new Date();
        return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    }

    // Haftanın gününü Pzt=0 ... Paz=6 olarak döndür
    function getTodayDayIndex() {
        let day = new Date().getDay(); // 0=Pazar, 1=Pzt ... 6=Cmt
        return day === 0 ? 6 : day - 1;
    }

    // Hafta anahtarı (Pazartesi bazlı)
    function getWeekKey() {
        const d = new Date();
        const diff = d.getDate() - getTodayDayIndex();
        const monday = new Date(d.setDate(diff));
        return `${monday.getFullYear()}-W${monday.getMonth() + 1}-${monday.getDate()}`;
    }

    let state = {
        xp: 0,
        rankLevel: 1,
        weekKey: getWeekKey(),
        dailyCompletedCounts: [0, 0, 0, 0, 0, 0, 0], // Her gün için tamamlanan görev sayısı (0 ise yıldız yok!)
        weeklyMergedDone: false,
        todayDate: getTodayDateStr(),
        usedTaskIdsToday: [], // Bugün havuzdan çekilen tüm görevlerin ID'leri (Bir daha asla çıkmaz)
        activeTasks: [],
        notifications: ["09:00", "14:00", "20:00"],
        lastNotifSent: {}
    };

    function loadState() {
        const saved = localStorage.getItem("pixelquest_save_v3");
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                // Rütbe ve XP kalıcıdır, asla sıfırlanmaz
                state.xp = parsed.xp || 0;
                state.rankLevel = parsed.rankLevel || 1;
                state.notifications = parsed.notifications || ["09:00", "14:00", "20:00"];
                state.lastNotifSent = parsed.lastNotifSent || {};

                // Haftalık seri kontrolü
                if (parsed.weekKey === getWeekKey()) {
                    state.weekKey = parsed.weekKey;
                    state.dailyCompletedCounts = parsed.dailyCompletedCounts || [0, 0, 0, 0, 0, 0, 0];
                    state.weeklyMergedDone = parsed.weeklyMergedDone || false;
                } else {
                    state.weekKey = getWeekKey();
                    state.dailyCompletedCounts = [0, 0, 0, 0, 0, 0, 0];
                    state.weeklyMergedDone = false;
                }

                // Günlük görev havuzu kontrolü
                if (parsed.todayDate === getTodayDateStr()) {
                    state.todayDate = parsed.todayDate;
                    state.usedTaskIdsToday = parsed.usedTaskIdsToday || [];
                    state.activeTasks = (parsed.activeTasks || []).map(t => ({ ...t, pending: false, timer: null }));
                } else {
                    // Yeni gün başladıysa sadece günlük görevler yenilenir, rütbe korunur
                    state.todayDate = getTodayDateStr();
                    state.usedTaskIdsToday = [];
                    state.activeTasks = [];
                }
            } catch (e) {
                console.error(e);
            }
        }

        // Eğer bugün henüz görev oluşturulmadıysa 4 benzersiz görev çek
        if (state.activeTasks.length === 0) {
            state.activeTasks = pullUniqueTasks(4);
            saveState();
        }
    }

    function saveState() {
        const toSave = {
            xp: state.xp,
            rankLevel: state.rankLevel,
            weekKey: state.weekKey,
            dailyCompletedCounts: state.dailyCompletedCounts,
            weeklyMergedDone: state.weeklyMergedDone,
            todayDate: state.todayDate,
            usedTaskIdsToday: state.usedTaskIdsToday,
            activeTasks: state.activeTasks.map(t => ({
                poolId: t.poolId,
                text: t.text,
                cat: t.cat,
                xp: t.xp,
                diff: t.diff,
                completed: t.completed
            })),
            notifications: state.notifications,
            lastNotifSent: state.lastNotifSent
        };
        localStorage.setItem("pixelquest_save_v3", JSON.stringify(toSave));
    }

    // Gün içerisinde daha önce hiç verilmemiş benzersiz görev çeker
    function pullUniqueTasks(count = 1) {
        let available = taskPool.filter(t => !state.usedTaskIdsToday.includes(t.poolId));
        if (available.length === 0) return []; // 1500+ görevin tamamı biterse

        let selected = [];
        for (let i = 0; i < count; i++) {
            if (available.length === 0) break;
            let randIdx = Math.floor(Math.random() * available.length);
            let chosen = available[randIdx];
            state.usedTaskIdsToday.push(chosen.poolId);
            selected.push({
                ...chosen,
                completed: false,
                pending: false,
                timer: null
            });
            available.splice(randIdx, 1);
        }
        return selected;
    }

    // =========================================================================
    // 5. ARAYÜZ GÜNCELLEME & ANİMASYON MANTIĞI
    // =========================================================================
    function updateUI() {
        let rank = ranks[state.rankLevel - 1] || ranks[ranks.length - 1];
        document.getElementById("rank-title").innerText = rank.name;
        document.getElementById("current-xp").innerText = state.xp;
        document.getElementById("max-xp").innerText = rank.max;
        
        let percent = Math.min(100, (state.xp / rank.max) * 100);
        document.getElementById("xp-fill").style.width = percent + "%";

        let badge = document.getElementById("rank-badge-icon");
        badge.innerHTML = getRankShieldSVG(rank.tier);
        if (rank.goldFrame) badge.classList.add("gold-frame");
        else badge.classList.remove("gold-frame");

        // Haftalık Seri Render (Sadece görev tamamlanan günlerde yıldız çıkar!)
        const weeklyContainer = document.getElementById("weekly-container");
        const days = ["Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"];
        const allSevenDaysCompleted = state.dailyCompletedCounts.every(c => c > 0);

        if (allSevenDaysCompleted && state.weeklyMergedDone) {
            // Pazar günü 7. gün tamamlandığında etrafı sarı, ortada özel kırmızı-elmas çekirdekli dev yıldız
            weeklyContainer.classList.add("weekly-grand-merged");
            weeklyContainer.innerHTML = `
                <div class="center-pixel-star" style="width:42px; height:42px;">
                    ${getPixelStarSVG("grand_weekly", 42)}
                </div>
            `;
        } else {
            weeklyContainer.classList.remove("weekly-grand-merged");
            let weeklyHTML = "";
            for (let i = 0; i < 7; i++) {
                let count = state.dailyCompletedCounts[i];
                let starHTML = `<span style="color:#444;">·</span>`;
                if (count === 1) {
                    starHTML = getPixelStarSVG("gold", 18);     // 1. görev: Altın yıldız
                } else if (count === 2) {
                    starHTML = getPixelStarSVG("bright", 18);   // 2. görev: Daha parlak yıldız
                } else if (count >= 3) {
                    starHTML = getPixelStarSVG("diamond", 18);  // 3+ görev: Elmas yıldız
                }

                weeklyHTML += `
                    <div class="day-box ${count > 0 ? 'has-star' : ''}">
                        <span>${days[i]}</span>
                        <div class="day-star-slot">${starHTML}</div>
                    </div>
                `;
            }
            weeklyContainer.innerHTML = weeklyHTML;
        }

        // Görev Kartları Render
        let tasksHTML = "";
        state.activeTasks.forEach((t, idx) => {
            if (t.completed) {
                tasksHTML += `
                    <div class="task-card completed">
                        <div class="center-pixel-star">
                            ${getPixelStarSVG("red_core", 34)}
                        </div>
                    </div>
                `;
            } else if (t.pending) {
                tasksHTML += `
                    <div class="task-card pending-confirm">
                        <div class="confirm-box">
                            <div class="confirm-top">
                                <span>Onay bekleniyor...</span>
                                <button class="confirm-btn" onclick="confirmTask(${idx})">TAMAMLA</button>
                            </div>
                            <div class="countdown-bar">
                                <div class="countdown-fill" id="cd-${idx}"></div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                tasksHTML += `
                    <div class="task-card" onclick="startTaskPending(${idx})">
                        <div class="task-info">
                            <h4>${t.text}</h4>
                            <div class="meta"><span>${t.cat}</span> • <span>${t.diff}</span></div>
                        </div>
                        <div class="task-xp">+${t.xp} XP</div>
                    </div>
                `;
            }
        });
        document.getElementById("tasks-list").innerHTML = tasksHTML;

        state.activeTasks.forEach((t, idx) => {
            if (t.pending) {
                setTimeout(() => {
                    let fill = document.getElementById(`cd-${idx}`);
                    if (fill) fill.style.width = "0%";
                }, 50);
            }
        });
    }

    function startTaskPending(idx) {
        let t = state.activeTasks[idx];
        if (t.completed || t.pending) return;

        t.pending = true;
        updateUI();

        t.timer = setTimeout(() => {
            if (t.pending && !t.completed) {
                t.pending = false;
                updateUI();
            }
        }, 5000);
    }

    function confirmTask(idx) {
        let t = state.activeTasks[idx];
        if (!t.pending) return;

        clearTimeout(t.timer);
        t.pending = false;

        // Kart üzerinde yavaşça sağdan ve soldan gelen piksel yıldızlar ve yayılan altın sarısı animasyonu başlat
        const cards = document.querySelectorAll('.task-card');
        const cardEl = cards[idx];
        if (cardEl) {
            cardEl.innerHTML = `
                <div class="gold-spread-bg"></div>
                <div class="merging-star-left anim-merge-left">${getPixelStarSVG("gold", 28)}</div>
                <div class="merging-star-right anim-merge-right">${getPixelStarSVG("gold", 28)}</div>
            `;
        }

        // Animasyonun yavaşça birleşip sarının yayılmasını bekle (1.25 saniye)
        setTimeout(() => {
            t.completed = true;

            // Bugünün tamamlanan görev sayısını artır
            let todayIdx = getTodayDayIndex();
            state.dailyCompletedCounts[todayIdx] = (state.dailyCompletedCounts[todayIdx] || 0) + 1;

            // XP ve Kalıcı Rütbe Kontrolü
            state.xp += t.xp;
            let currentRankMax = ranks[state.rankLevel - 1].max;
            if (state.xp >= currentRankMax) {
                state.xp -= currentRankMax;
                state.rankLevel = Math.min(ranks.length, state.rankLevel + 1);
                triggerRankShake();
            }

            // Eğer 7 günün tamamında da en az 1 görev yapıldıysa ve Pazar günü görevi tamamlandıysa haftalık birleşimi tetikle
            if (state.dailyCompletedCounts.every(c => c > 0) && !state.weeklyMergedDone) {
                state.weeklyMergedDone = true;
            }

            saveState();
            updateUI();
        }, 1250);
    }

    function triggerRankShake() {
        let badge = document.getElementById("rank-badge-icon");
        badge.classList.add("shake-animation");
        setTimeout(() => badge.classList.remove("shake-animation"), 900);
    }

    // Artı Butonu: Yavaşça büyüyüp sağa sola açılarak yeni benzersiz görev çıkarır
    function addNewTaskWithAnimation(btn) {
        if (btn.classList.contains("splitting")) return;
        btn.classList.add("splitting");

        setTimeout(() => {
            let newTasks = pullUniqueTasks(1);
            if (newTasks.length > 0) {
                state.activeTasks.push(newTasks[0]);
                saveState();
                updateUI();
            }
            btn.classList.remove("splitting");
        }, 1050);
    }

    // Rütbe Listesi Modalı (Demir, Bronz, Gümüş, Altın, Elmas 1-5 + Siyah Elmas)
    function toggleRankModal(show) {
        let modal = document.getElementById("rank-modal");
        if (show) {
            let html = "";
            ranks.forEach((r, idx) => {
                let isCurrent = (idx + 1 === state.rankLevel);
                html += `
                    <div class="rank-list-item ${isCurrent ? 'current' : ''}">
                        <div style="display:flex; align-items:center; gap:8px;">
                            ${getRankShieldSVG(r.tier)}
                            <span>${r.name}</span>
                        </div>
                        <span>${isCurrent ? '★ MEVCUT' : r.max + ' XP'}</span>
                    </div>
                `;
            });
            document.getElementById("rank-list-container").innerHTML = html;
            modal.classList.add("active");
        } else {
            modal.classList.remove("active");
        }
    }

    // Ayarlar & Bildirim Sistemi
    function toggleSettingsModal(show) {
        let modal = document.getElementById("settings-modal");
        if (show) {
            document.getElementById("notif-1").value = state.notifications[0] || "09:00";
            document.getElementById("notif-2").value = state.notifications[1] || "14:00";
            document.getElementById("notif-3").value = state.notifications[2] || "20:00";
            modal.classList.add("active");
        } else {
            modal.classList.remove("active");
        }
    }

    function saveSettings() {
        let t1 = document.getElementById("notif-1").value;
        let t2 = document.getElementById("notif-2").value;
        let t3 = document.getElementById("notif-3").value;
        state.notifications = [t1, t2, t3];
        saveState();

        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }
        toggleSettingsModal(false);
    }

    function checkNotifications() {
        const now = new Date();
        const hhmm = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');
        const today = getTodayDateStr();

        state.notifications.forEach((timeStr, idx) => {
            const key = `${today}_${idx}_${timeStr}`;
            if (hhmm === timeStr && !state.lastNotifSent[key]) {
                state.lastNotifSent[key] = true;
                saveState();
                if ("Notification" in window && Notification.permission === "granted") {
                    new Notification("PixelQuest Görev Hatırlatıcısı", {
                        body: "Günlük görevlerini tamamlayıp yıldızlarını toplamayı ve rütbe atlamayı unutma!",
                        icon: "icon.png"
                    });
                }
            }
        });
    }
    setInterval(checkNotifications, 15000);

    // =========================================================================
    // 6. DİNAMİK SAATLİ ARKA PLAN (AYNEN KORUNDU)
    // =========================================================================
    const canvas = document.getElementById("bg-canvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let cloudOffset = 0;
    let trainPos = 0;

    function drawAnimatedBackground() {
        let now = new Date();
        let hour = now.getHours();
        let minute = now.getMinutes();
        document.getElementById("time-display").innerText = String(hour).padStart(2, '0') + ":" + String(minute).padStart(2, '0');

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let w = canvas.width;
        let h = canvas.height;

        cloudOffset += 0.2;
        if (cloudOffset > w) cloudOffset = 0;

        trainPos += 1.5;
        if (trainPos > w + 100) trainPos = -100;

        if (hour >= 7 && hour < 13) {
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, "#4facfe");
            grad.addColorStop(1, "#00f2fe");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = "#fffacd";
            ctx.beginPath();
            ctx.arc(w * 0.75, h * 0.3, 35, 0, Math.PI * 2);
            ctx.fill();

            drawBuildings(["#203a43", "#2c5364", "#1a2530"]);
        } else if (hour >= 13 && hour < 19) {
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, "#2980b9");
            grad.addColorStop(1, "#6dd5fa");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.fillRect((w * 0.1 + cloudOffset) % (w + 100) - 50, h * 0.15, 90, 22);
            ctx.fillRect((w * 0.6 + cloudOffset * 0.7) % (w + 100) - 50, h * 0.28, 110, 26);

            drawBuildings(["#1b4f72", "#154360", "#0e3a50"]);
        } else if (hour >= 19 && hour < 21) {
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, "#cb356b");
            grad.addColorStop(1, "#bd3f32");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = "#f39c12";
            ctx.beginPath();
            ctx.arc(w * 0.5, h * 0.4, 40, 0, Math.PI * 2);
            ctx.fill();

            drawBuildings(["#4a1525", "#3a101b", "#250810"]);

            ctx.fillStyle = "#f1c40f";
            ctx.fillRect(trainPos, h - 85, 80, 16);
            ctx.fillStyle = "#333";
            ctx.fillRect(trainPos + 10, h - 83, 14, 10);
            ctx.fillRect(trainPos + 35, h - 83, 14, 10);
            ctx.fillRect(trainPos + 60, h - 83, 14, 10);
        } else {
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, "#09122c");
            grad.addColorStop(1, "#181c3d");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = "#ffffff";
            for (let i = 0; i < 45; i++) {
                let sx = (i * 41) % w;
                let sy = (i * 27) % (h * 0.65);
                ctx.fillRect(sx, sy, 2, 2);
            }

            drawBuildings(["#0f172a", "#1e293b", "#0b0f19"]);
        }

        requestAnimationFrame(drawAnimatedBackground);
    }

    function drawBuildings(colors) {
        let w = canvas.width;
        let h = canvas.height;
        let bWidth = 42;
        let count = Math.ceil(w / bWidth) + 1;

        for (let i = 0; i < count; i++) {
            let bH = 130 + ((i * 47) % 170);
            let x = i * (bWidth - 2);
            let y = h - bH;

            ctx.fillStyle = colors[i % colors.length];
            ctx.fillRect(x, y, bWidth, bH);

            ctx.fillStyle = "rgba(255, 255, 200, 0.65)";
            for (let wx = x + 6; wx < x + bWidth - 6; wx += 10) {
                for (let wy = y + 12; wy < h - 10; wy += 18) {
                    if ((i + wx + wy) % 3 !== 0) {
                        ctx.fillRect(wx, wy, 5, 8);
                    }
                }
            }
        }
    }

    window.onload = () => {
        loadState();
        updateUI();
        resizeCanvas();
        requestAnimationFrame(drawAnimatedBackground);

        // Yavaş ve Profesyonel Açılış Animasyonu (2.4 saniye)
        setTimeout(() => {
            let splash = document.getElementById("splash-screen");
            splash.classList.add("zoom-out");
        }, 2400);
    };
</script>
