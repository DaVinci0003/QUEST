<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixelQuest</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0b0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }
        .phone-frame {
            width: 100vw;
            height: 100vh;
            max-width: 430px;
            max-height: 890px;
            background: #000;
            border-radius: 0px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
        }
        @media(min-width: 440px) {
            .phone-frame {
                border-radius: 40px;
                border: 10px solid #202028;
                height: 850px;
            }
        }
        
        /* Dinamik Animasyonlu Canvas Arka Plan */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Arayüz Katmanı */
        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: rgba(10, 10, 15, 0.25);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            overflow-y: auto;
            padding: 16px;
        }
        .app-container::-webkit-scrollbar {
            width: 4px;
        }
        .app-container::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }

        /* Header / Rütbe Barı */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 20, 30, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 14px;
        }
        .rank-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .rank-badge {
            width: 42px;
            height: 42px;
            background: #1a1a24;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            border: 2px solid #555;
            position: relative;
        }
        .rank-badge.gold-frame {
            border-color: #ffd700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
        }
        .rank-text h3 {
            font-size: 14px;
            font-weight: bold;
            color: #ffd700;
            letter-spacing: 0.5px;
        }
        .rank-text p {
            font-size: 11px;
            color: #ccc;
        }
        .xp-bar-container {
            width: 90px;
            background: rgba(0,0,0,0.6);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .xp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Haftalık Seri Barı */
        .weekly-series {
            background: rgba(20, 20, 30, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        .day-box {
            width: 36px;
            height: 44px;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            color: #aaa;
            transition: all 0.4s;
        }
        .day-box.completed {
            background: rgba(255, 215, 0, 0.25);
            border-color: #ffd700;
            color: #ffd700;
            box-shadow: 0 0 8px rgba(255,215,0,0.4);
        }
        .day-box .day-star {
            font-size: 14px;
            margin-top: 2px;
        }

        /* Haftalık Tamamlama Kutlaması (Pazar gününe özel dev yıldız birleşimi) */
        .weekly-grand-star {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 20, 30, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            z-index: 5;
            animation: fadeInWeekly 0.5s ease;
        }
        @keyframes fadeInWeekly {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .grand-star-icon {
            font-size: 36px;
            animation: grandPulse 1.5s infinite alternate;
            filter: drop-shadow(0 0 15px #ffd700);
        }
        @keyframes grandPulse {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.2) rotate(10deg); }
        }

        /* Bölüm Başlığı */
        .section-title {
            font-size: 12px;
            color: #ddd;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Görev Listesi */
        .tasks-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
        }

        /* Görev Kartı (Buzlu Cam) */
        .task-card {
            background: rgba(25, 25, 40, 0.6);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }
        .task-card:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(35, 35, 55, 0.7);
        }
        .task-info h4 {
            font-size: 13px;
            color: #fff;
            margin-bottom: 4px;
            font-weight: bold;
            line-height: 1.3;
        }
        .task-info .meta {
            font-size: 10px;
            color: #bbb;
            display: flex;
            gap: 8px;
        }
        .task-xp {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid rgba(255, 215, 0, 0.4);
            white-space: nowrap;
        }

        /* Tamamlanmış Görev: Komple Sarı, Yazılar Yok, Merkezde Yüksek Kaliteli Piksel Yıldız */
        .task-card.completed {
            background: #ffd700 !important;
            border-color: #ffaa00 !important;
            justify-content: center !important;
            cursor: default;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
            padding: 18px;
        }
        .task-card.completed .task-info,
        .task-card.completed .task-xp,
        .task-card.completed .pending-overlay {
            display: none !important;
        }
        
        /* Kaliteli Piksel Yıldız İkonu */
        .pixel-star-icon {
            width: 32px;
            height: 32px;
            display: inline-block;
            position: relative;
            background: #ff4500;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            box-shadow: 0 0 12px #fff, 0 0 20px #ffaa00;
            animation: starPulse 1.8s infinite alternate ease-in-out;
        }
        @keyframes starPulse {
            0% { transform: scale(1) rotate(0deg); filter: brightness(1); }
            100% { transform: scale(1.15) rotate(5deg); filter: brightness(1.25); }
        }

        /* 5 Saniye Onay / Tamamlama Modu */
        .task-card.pending-confirm {
            border-color: #ffd700;
            background: rgba(45, 40, 20, 0.85);
        }
        .confirm-box {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 6px;
        }
        .confirm-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .confirm-top span {
            font-size: 12px;
            color: #ffd700;
            font-weight: bold;
        }
        .confirm-btn {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }
        .countdown-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            overflow: hidden;
        }
        .countdown-fill {
            height: 100%;
            background: #ffd700;
            width: 100%;
            transition: width 5s linear;
        }

        /* Geniş Görev Ekleme Butonu */
        .add-task-btn {
            width: 100%;
            background: rgba(30, 30, 45, 0.75);
            backdrop-filter: blur(10px);
            border: 1px dashed rgba(255, 255, 255, 0.35);
            border-radius: 14px;
            padding: 14px;
            color: #eee;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            margin-bottom: 20px;
        }
        .add-task-btn:hover {
            background: rgba(50, 50, 75, 0.9);
            border-color: rgba(255, 255, 255, 0.7);
            color: #fff;
        }

        /* Rütbe Atlama Modal / Pop-up Ekranı */
        #rank-up-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        #rank-up-modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .rank-up-card {
            background: linear-gradient(135deg, #2a2a3d, #1a1a26);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 24px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            animation: modalPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes modalPop {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .rank-up-card h2 {
            color: #ffd700;
            font-size: 18px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        .rank-up-card p {
            color: #ddd;
            font-size: 13px;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .rank-up-btn {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255,215,0,0.4);
            transition: transform 0.1s;
        }
        .rank-up-btn:active {
            transform: scale(0.95);
        }

        /* Açılış Splash Ekranı */
        #splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050508;
            z-index: 300;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: opacity 0.9s cubic-bezier(0.77, 0, 0.175, 1), transform 0.9s cubic-bezier(0.77, 0, 0.175, 1);
        }
        #splash-screen.zoom-out {
            opacity: 0;
            transform: scale(8);
            pointer-events: none;
        }
        .splash-star-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: splashGrow 1.2s infinite alternate ease-in-out;
        }
        .big-pixel-star {
            width: 80px;
            height: 80px;
            background: #ffd700;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            box-shadow: 0 0 35px #ffd700, 0 0 70px rgba(255,215,0,0.6);
        }
        @keyframes splashGrow {
            0% { transform: scale(0.9); }
            100% { transform: scale(1.1); }
        }
        .splash-title {
            font-size: 16px;
            color: #ffd700;
            letter-spacing: 2px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="phone-frame">
    <!-- Açılış Ekranı: Yıldızın İçinden Geçiş -->
    <div id="splash-screen">
        <div class="splash-star-container">
            <div class="big-pixel-star"></div>
            <div class="splash-title">PIXELQUEST</div>
        </div>
    </div>

    <!-- Rütbe Atlama Modalı -->
    <div id="rank-up-modal">
        <div class="rank-up-card">
            <h2>🎉 RÜTBE ATLADIN!</h2>
            <p id="rank-up-msg">Tebrikler kahraman! Yeni rütbene ulaştın ve gücün katlandı.</p>
            <button class="rank-up-btn" onclick="closeRankModal()">DEVAM ET</button>
        </div>
    </div>

    <!-- Animasyonlu Dinamik Arka Plan -->
    <canvas id="bg-canvas"></canvas>

    <!-- Uygulama Arayüzü -->
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="rank-info">
                <div class="rank-badge" id="rank-badge-icon">🛡️</div>
                <div class="rank-text">
                    <h3 id="rank-title">Demir I</h3>
                    <p><span id="current-xp">0</span> / <span id="max-xp">100</span> XP</p>
                    <div class="xp-bar-container">
                        <div class="xp-bar-fill" id="xp-fill"></div>
                    </div>
                </div>
            </div>
            <div style="font-size: 11px; color: #ddd; text-align: right;" id="time-display">07:00</div>
        </div>

        <!-- Haftalık Seri -->
        <div class="weekly-series" id="weekly-container"></div>

        <!-- Görevler -->
        <div class="section-title">Günlük Görev Havuzu</div>
        <div class="tasks-container" id="tasks-list"></div>

        <!-- Geniş Ekleme Butonu -->
        <button class="add-task-btn" onclick="addNewTask()">
            <span>+ Yeni Görev İste & Havuzdan Çek</span>
        </button>
    </div>
</div>

<script>
    // Geniş 1000+ Görev Havuzu Örnekleri
    const taskPool = [
        { text: "Sabit saatte uyan ve 10 dk esneme yap", cat: "Spor", xp: 10, diff: "Kolay" },
        { text: "2 litre su tüketim hedefini tamamla", cat: "Kişisel Gelişim", xp: 10, diff: "Kolay" },
        { text: "Bugün en az 20 sayfa kitap oku", cat: "Kişisel Gelişim", xp: 15, diff: "Orta" },
        { text: "30 dakika tempolu yürüyüş yap", cat: "Spor", xp: 15, diff: "Orta" },
        { text: "Bir arkadaşına hal hatır sor / mesaj at", cat: "Sosyal", xp: 10, diff: "Kolay" },
        { text: "Yeni bir kelime veya yabancı dil terimi öğren", cat: "Kişisel Gelişim", xp: 10, diff: "Kolay" },
        { text: "Akşam ekran süresini yatmadan 1 saat önce kes", cat: "Kişisel Gelişim", xp: 20, diff: "Zor" },
        { text: "50 adet şınav / mekik serisi tamamla", cat: "Spor", xp: 20, diff: "Zor" },
        { text: "Sevdiklerine kahve veya çay ikram et", cat: "Sosyal", xp: 15, diff: "Orta" },
        { text: "Günlük bütçe ve harcama kontrolü yap", cat: "Kişisel Gelişim", xp: 10, diff: "Kolay" },
        { text: "15 dakika meditasyon veya nefes egzersizi yap", cat: "Kişisel Gelişim", xp: 15, diff: "Orta" },
        { text: "Açık havada güneş ışığı alarak 10 dk yürü", cat: "Spor", xp: 10, diff: "Kolay" }
    ];

    let player = {
        xp: 0,
        rankLevel: 1,
        currentStreak: [true, true, true, true, true, true, true] // Pzt-Paz (Pazar dahil tamamlanmış test için)
    };

    const ranks = [
        { name: "Demir I", max: 100, goldFrame: false },
        { name: "Demir II", max: 100, goldFrame: false },
        { name: "Demir III", max: 100, goldFrame: false },
        { name: "Demir IV", max: 100, goldFrame: false },
        { name: "Demir V", max: 100, goldFrame: true },
        { name: "Bronz I", max: 150, goldFrame: false },
        { name: "Altın I", max: 200, goldFrame: false },
        { name: "Gümüş I", max: 250, goldFrame: false },
        { name: "Elmas I", max: 300, goldFrame: false },
        { name: "Siyah Elmas", max: 500, goldFrame: true }
    ];

    let activeTasks = [];

    function getRandomTasks(count = 3) {
        let selected = [];
        let poolCopy = [...taskPool];
        for (let i = 0; i < count; i++) {
            if (poolCopy.length === 0) break;
            let index = Math.floor(Math.random() * poolCopy.length);
            selected.push({ ...poolCopy[index], id: Date.now() + i, completed: false, pending: false, timer: null });
            poolCopy.splice(index, 1);
        }
        return selected;
    }

    function updateUI() {
        let rank = ranks[player.rankLevel - 1] || ranks[ranks.length - 1];
        document.getElementById("rank-title").innerText = rank.name;
        document.getElementById("current-xp").innerText = player.xp;
        document.getElementById("max-xp").innerText = rank.max;
        
        let percent = Math.min(100, (player.xp / rank.max) * 100);
        document.getElementById("xp-fill").style.width = percent + "%";

        let badge = document.getElementById("rank-badge-icon");
        if (rank.goldFrame) badge.classList.add("gold-frame");
        else badge.classList.remove("gold-frame");

        // Haftalık Seri & Pazar Büyük Yıldız Birleşimi
        let days = ["Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"];
        let allCompleted = player.currentStreak.every(val => val === true);
        let weeklyHTML = "";
        
        for (let i = 0; i < 7; i++) {
            let isComp = player.currentStreak[i];
            weeklyHTML += `
                <div class="day-box ${isComp ? 'completed' : ''}">
                    <span>${days[i]}</span>
                    <span class="day-star">${isComp ? '⭐' : '·'}</span>
                </div>
            `;
        }

        if (allCompleted) {
            weeklyHTML += `
                <div class="weekly-grand-star">
                    <div class="grand-star-icon">⭐</div>
                    <div style="font-size:11px; color:#ffd700; font-weight:bold;">HAFTA TAMAMLANDI! BİRLEŞEN YILDIZ</div>
                </div>
            `;
        }
        document.getElementById("weekly-container").innerHTML = weeklyHTML;

        // Görevler
        let tasksHTML = "";
        activeTasks.forEach((t, idx) => {
            if (t.completed) {
                tasksHTML += `
                    <div class="task-card completed">
                        <div class="pixel-star-icon"></div>
                    </div>
                `;
            } else if (t.pending) {
                tasksHTML += `
                    <div class="task-card pending-confirm">
                        <div class="confirm-box">
                            <div class="confirm-top">
                                <span>Onayla bekleniyor...</span>
                                <button class="confirm-btn" onclick="confirmTask(${idx})">TAMAMLA</button>
                            </div>
                            <div class="countdown-bar">
                                <div class="countdown-fill" id="cd-${idx}"></div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                tasksHTML += `
                    <div class="task-card" onclick="startTaskPending(${idx})">
                        <div class="task-info">
                            <h4>${t.text}</h4>
                            <div class="meta"><span>${t.cat}</span> • <span>${t.diff}</span></div>
                        </div>
                        <div class="task-xp">+${t.xp} XP</div>
                    </div>
                `;
            }
        });
        document.getElementById("tasks-list").innerHTML = tasksHTML;

        activeTasks.forEach((t, idx) => {
            if (t.pending) {
                setTimeout(() => {
                    let fill = document.getElementById(`cd-${idx}`);
                    if (fill) fill.style.width = "0%";
                }, 50);
            }
        });
    }

    function startTaskPending(idx) {
        let t = activeTasks[idx];
        if (t.completed || t.pending) return;

        t.pending = true;
        updateUI();

        t.timer = setTimeout(() => {
            if (t.pending && !t.completed) {
                t.pending = false;
                updateUI();
            }
        }, 5000);
    }

    function confirmTask(idx) {
        let t = activeTasks[idx];
        if (!t.pending) return;

        clearTimeout(t.timer);
        t.pending = false;
        t.completed = true;

        // XP ve Rütbe Kontrolü
        player.xp += t.xp;
        let currentRankMax = ranks[player.rankLevel - 1].max;
        if (player.xp >= currentRankMax) {
            player.xp -= currentRankMax;
            player.rankLevel = Math.min(ranks.length, player.rankLevel + 1);
            showRankUpModal(ranks[player.rankLevel - 1].name);
        }
        updateUI();
    }

    function showRankUpModal(newRankName) {
        document.getElementById("rank-up-msg").innerText = `Tebrikler kahraman! Başarıyla rütbe atladın ve yeni unvanın: ${newRankName}`;
        document.getElementById("rank-up-modal").classList.add("active");
    }

    function closeRankModal() {
        document.getElementById("rank-up-modal").classList.remove("active");
    }

    function addNewTask() {
        let newT = getRandomTasks(1)[0];
        if (newT) {
            activeTasks.push(newT);
            updateUI();
        }
    }

    // Animasyonlu Kanvas Arka Plan
    const canvas = document.getElementById("bg-canvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let cloudOffset = 0;
    let trainPos = 0;

    function drawAnimatedBackground() {
        let now = new Date();
        let hour = now.getHours();
        let minute = now.getMinutes();
        document.getElementById("time-display").innerText = String(hour).padStart(2, '0') + ":" + String(minute).padStart(2, '0');

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let w = canvas.width;
        let h = canvas.height;

        cloudOffset += 0.2;
        if (cloudOffset > w) cloudOffset = 0;

        trainPos += 1.5;
        if (trainPos > w + 100) trainPos = -100;

        if (hour >= 7 && hour < 13) {
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, "#4facfe");
            grad.addColorStop(1, "#00f2fe");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = "#fffacd";
            ctx.beginPath();
            ctx.arc(w * 0.75, h * 0.3, 35, 0, Math.PI * 2);
            ctx.fill();

            drawBuildings(["#203a43", "#2c5364", "#1a2530"]);
        } else if (hour >= 13 && hour < 19) {
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, "#2980b9");
            grad.addColorStop(1, "#6dd5fa");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.fillRect((w * 0.1 + cloudOffset) % (w + 100) - 50, h * 0.15, 90, 22);
            ctx.fillRect((w * 0.6 + cloudOffset * 0.7) % (w + 100) - 50, h * 0.28, 110, 26);

            drawBuildings(["#1b4f72", "#154360", "#0e3a50"]);
        } else if (hour >= 19 && hour < 21) {
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, "#cb356b");
            grad.addColorStop(1, "#bd3f32");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = "#f39c12";
            ctx.beginPath();
            ctx.arc(w * 0.5, h * 0.4, 40, 0, Math.PI * 2);
            ctx.fill();

            drawBuildings(["#4a1525", "#3a101b", "#250810"]);

            ctx.fillStyle = "#f1c40f";
            ctx.fillRect(trainPos, h - 85, 80, 16);
            ctx.fillStyle = "#333";
            ctx.fillRect(trainPos + 10, h - 83, 14, 10);
            ctx.fillRect(trainPos + 35, h - 83, 14, 10);
            ctx.fillRect(trainPos + 60, h - 83, 14, 10);
        } else {
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, "#09122c");
            grad.addColorStop(1, "#181c3d");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = "#ffffff";
            for (let i = 0; i < 45; i++) {
                let sx = (i * 41) % w;
                let sy = (i * 27) % (h * 0.65);
                ctx.fillRect(sx, sy, 2, 2);
            }

            drawBuildings(["#0f172a", "#1e293b", "#0b0f19"]);
        }

        requestAnimationFrame(drawAnimatedBackground);
    }

    function drawBuildings(colors) {
        let w = canvas.width;
        let h = canvas.height;
        let bWidth = 42;
        let count = Math.ceil(w / bWidth) + 1;

        for (let i = 0; i < count; i++) {
            let bH = 130 + ((i * 47) % 170);
            let x = i * (bWidth - 2);
            let y = h - bH;

            ctx.fillStyle = colors[i % colors.length];
            ctx.fillRect(x, y, bWidth, bH);

            ctx.fillStyle = "rgba(255, 255, 200, 0.65)";
            for (let wx = x + 6; wx < x + bWidth - 6; wx += 10) {
                for (let wy = y + 12; wy < h - 10; wy += 18) {
                    if ((i + wx + wy) % 3 !== 0) {
                        ctx.fillRect(wx, wy, 5, 8);
                    }
                }
            }
        }
    }

    window.onload = () => {
        activeTasks = getRandomTasks(4);
        updateUI();
        resizeCanvas();
        requestAnimationFrame(drawAnimatedBackground);

        setTimeout(() => {
            let splash = document.getElementById("splash-screen");
            splash.classList.add("zoom-out");
        }, 1300);
    };
</script>
