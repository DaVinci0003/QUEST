<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PixelQuest</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0b0b0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }
        .phone-frame {
            width: 100vw;
            height: 100vh;
            max-width: 430px;
            max-height: 890px;
            background: #000;
            border-radius: 0px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
        }
        @media(min-width: 440px) {
            .phone-frame {
                border-radius: 40px;
                border: 10px solid #202028;
                height: 850px;
            }
        }
        
        /* Dinamik Animasyonlu Canvas Arka Plan */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Arayüz Katmanı */
        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: rgba(10, 10, 15, 0.25);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            overflow-y: auto;
            padding: 16px;
        }
        .app-container::-webkit-scrollbar {
            width: 4px;
        }
        .app-container::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }

        /* Header / Rütbe Barı */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 20, 30, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 14px;
        }
        .rank-info {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .rank-badge {
            width: 42px;
            height: 42px;
            background: #1a1a24;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            border: 2px solid #555;
            position: relative;
        }
        .rank-badge.gold-frame {
            border-color: #ffd700;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
        }
        .rank-text h3 {
            font-size: 14px;
            font-weight: bold;
            color: #ffd700;
            letter-spacing: 0.5px;
        }
        .rank-text p {
            font-size: 11px;
            color: #ccc;
        }
        .xp-bar-container {
            width: 90px;
            background: rgba(0,0,0,0.6);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .xp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Ayarlar İkonu */
        .settings-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            width: 36px;
            height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 18px;
            color: #fff;
            transition: background 0.2s;
        }
        .settings-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        /* Haftalık Seri Barı */
        .weekly-series {
            background: rgba(20, 20, 30, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        .day-box {
            width: 36px;
            height: 44px;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            color: #aaa;
            transition: all 0.4s;
        }
        .day-box.completed {
            background: rgba(255, 215, 0, 0.25);
            border-color: #ffd700;
            color: #ffd700;
            box-shadow: 0 0 8px rgba(255,215,0,0.4);
        }
        .day-box .day-star {
            font-size: 14px;
            margin-top: 2px;
        }

        /* Bölüm Başlığı */
        .section-title {
            font-size: 12px;
            color: #ddd;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Görev Listesi */
        .tasks-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
        }

        /* Görev Kartı (Buzlu Cam) */
        .task-card {
            background: rgba(25, 25, 40, 0.6);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }
        .task-card:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(35, 35, 55, 0.7);
        }
        .task-info h4 {
            font-size: 13px;
            color: #fff;
            margin-bottom: 4px;
            font-weight: bold;
            line-height: 1.3;
        }
        .task-info .meta {
            font-size: 10px;
            color: #bbb;
            display: flex;
            gap: 8px;
        }
        .task-xp {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid rgba(255, 215, 0, 0.4);
            white-space: nowrap;
        }

        /* Tamamlanmış Görev & Sağdan Soldan Gelen Yıldız Animasyonu */
        .task-card.completed {
            background: #ffd700 !important;
            border-color: #ffaa00 !important;
            justify-content: center !important;
            cursor: default;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
            padding: 18px;
        }
        .task-card.completed .task-info,
        .task-card.completed .task-xp,
        .task-card.completed .pending-overlay {
            display: none !important;
        }

        /* Görev Tamamlanırken Sağdan ve Soldan Gelen Yıldızlar */
        .flying-star-left, .flying-star-right {
            position: absolute;
            font-size: 24px;
            z-index: 10;
            filter: drop-shadow(0 0 8px #ff4500);
            pointer-events: none;
        }
        @keyframes flyLeftToCenter {
            0% { transform: translate(-120px, 0) scale(0.5) rotate(0deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translate(0, 0) scale(1.2) rotate(360deg); opacity: 1; }
        }
        @keyframes flyRightToCenter {
            0% { transform: translate(120px, 0) scale(0.5) rotate(0deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translate(0, 0) scale(1.2) rotate(-360deg); opacity: 1; }
        }
        .animate-fly-left {
            animation: flyLeftToCenter 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .animate-fly-right {
            animation: flyRightToCenter 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Merkezdeki Kırmızı Piksel Yıldız */
        .center-red-star {
            width: 34px;
            height: 34px;
            background: #ff2200;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            box-shadow: 0 0 15px #ffd700, 0 0 25px #ff2200;
            animation: starPulse 1.5s infinite alternate ease-in-out;
        }
        @keyframes starPulse {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.2); filter: brightness(1.3); }
        }

        /* 5 Saniye Onay / Tamamlama Modu */
        .task-card.pending-confirm {
            border-color: #ffd700;
            background: rgba(45, 40, 20, 0.85);
        }
        .confirm-box {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 6px;
        }
        .confirm-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .confirm-top span {
            font-size: 12px;
            color: #ffd700;
            font-weight: bold;
        }
        .confirm-btn {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
        }
        .countdown-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            overflow: hidden;
        }
        .countdown-fill {
            height: 100%;
            background: #ffd700;
            width: 100%;
            transition: width 5s linear;
        }

        /* Yeni Görev İsteme: Büyük Artı Düğmesi ve Sağa Sola Bölünme Animasyonu */
        .add-task-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            position: relative;
        }
        .big-plus-btn {
            width: 60px;
            height: 60px;
            background: rgba(40, 40, 60, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 215, 0, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .big-plus-btn:hover {
            transform: scale(1.1);
            border-color: #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
        }
        .plus-icon {
            font-size: 28px;
            color: #ffd700;
            font-weight: bold;
            transition: transform 0.4s ease;
        }
        /* Artının Ortadan İkiye Bölünme / Sağa Sola Açılma Efekti */
        .big-plus-btn.splitting .plus-left {
            transform: translateX(-20px) rotate(-45deg);
            opacity: 0;
        }
        .big-plus-btn.splitting .plus-right {
            transform: translateX(20px) rotate(45deg);
            opacity: 0;
        }

        /* Rütbe Listesi Modalı */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 250;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: linear-gradient(135deg, #222233, #151520);
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 350px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.4);
        }
        .modal-card h2 {
            color: #ffd700;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .rank-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 13px;
        }
        .rank-list-item.current {
            background: rgba(255, 215, 0, 0.15);
            border-radius: 8px;
            border-color: #ffd700;
            color: #ffd700;
            font-weight: bold;
        }
        .close-modal-btn {
            width: 100%;
            margin-top: 15px;
            background: #ffd700;
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Rütbe Atlama Titreme & Pop-up Efekti */
        @keyframes rankShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-4px, 2px) rotate(-3deg); }
            40% { transform: translate(4px, -2px) rotate(3deg); }
            60% { transform: translate(-4px, -2px) rotate(-2deg); }
            80% { transform: translate(4px, 2px) rotate(2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .shake-animation {
            animation: rankShake 0.5s ease-in-out;
        }

        /* Haftalık Tamamlama Pazar Günü Kutlama Efekti (Dev Yıldız) */
        #weekly-celebration {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.92);
            z-index: 300;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        #weekly-celebration.active {
            opacity: 1;
            pointer-events: auto;
        }
        .mega-star {
            width: 90px;
            height: 90px;
            background: #ffd700;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            box-shadow: 0 0 50px #ffd700, 0 0 100px rgba(255,215,0,0.6);
            animation: megaPulse 1.2s infinite alternate ease-in-out;
        }
        @keyframes megaPulse {
            0% { transform: scale(0.9) rotate(0deg); }
            100% { transform: scale(1.15) rotate(15deg); }
        }

        /* Ayarlar Modalı */
        .settings-group {
            margin-bottom: 12px;
        }
        .settings-group label {
            font-size: 11px;
            color: #aaa;
            display: block;
            margin-bottom: 4px;
        }
        .settings-group input {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px;
            border-radius: 6px;
            color: #fff;
            font-family: inherit;
            font-size: 12px;
        }

        /* Açılış İkon/Logo Büyüme Animasyonu (İkon ile Tam Uyumlu) */
        #splash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050508;
            z-index: 400;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: opacity 0.8s cubic-bezier(0.77, 0, 0.175, 1), transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }
        #splash-screen.zoom-out {
            opacity: 0;
            transform: scale(10);
            pointer-events: none;
        }
        .splash-star-icon {
            width: 90px;
            height: 90px;
            background: #ffd700;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            box-shadow: 0 0 40px #ffd700, 0 0 80px rgba(255,215,0,0.7);
            animation: splashPulse 1s infinite alternate ease-in-out;
        }
        @keyframes splashPulse {
            0% { transform: scale(0.95); }
            100% { transform: scale(1.1); }
        }
    </style>
</head>
<body>

<div class="phone-frame">
    <!-- Açılış Ekranı: Yıldız İkonu Büyüme Geçişi -->
    <div id="splash-screen">
        <div class="splash-star-icon"></div>
    </div>

    <!-- Rütbe Listesi Modalı -->
    <div class="modal-overlay" id="rank-modal">
        <div class="modal-card">
            <h2>🏆 RÜTBE KADEMELERİ</h2>
            <div id="rank-list-container"></div>
            <button class="close-modal-btn" onclick="toggleRankModal(false)">KAPAT</button>
        </div>
    </div>

    <!-- Ayarlar Modalı -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-card">
            <h2>⚙️ BİLDİRİM AYARLARI</h2>
            <p style="font-size:11px; color:#bbb; margin-bottom:12px;">Günlük 3 bildirim zamanını ayarlayın:</p>
            <div class="settings-group">
                <label>1. Bildirim (Sabah)</label>
                <input type="time" id="notif-1" value="09:00">
            </div>
            <div class="settings-group">
                <label>2. Bildirim (Öğleden Sonra)</label>
                <input type="time" id="notif-2" value="14:00">
            </div>
            <div class="settings-group">
                <label>3. Bildirim (Akşam)</label>
                <input type="time" id="notif-3" value="20:00">
            </div>
            <button class="close-modal-btn" onclick="saveSettings()">KAYDET & AKTİFLEŞTİR</button>
        </div>
    </div>

    <!-- Pazar Günü Hafta Tamamlama Dev Yıldız Kutlaması -->
    <div id="weekly-celebration">
        <div class="mega-star"></div>
        <h2 style="color:#ffd700; font-size:16px; text-align:center;">HAFTA BAŞARIYLA TAMAMLANDI!</h2>
        <p style="color:#ddd; font-size:12px; text-align:center; padding:0 20px;">7 gün boyunca tüm görevleri tamamlayarak muazzam bir seriye ulaştın!</p>
        <button class="rank-up-btn" onclick="closeWeeklyCelebration()" style="margin-top:10px; background:#ffd700; border:none; padding:10px 20px; border-radius:8px; font-weight:bold; cursor:pointer;">HARİKA!</button>
    </div>

    <!-- Animasyonlu Kanvas Arka Plan -->
    <canvas id="bg-canvas"></canvas>

    <!-- Uygulama Arayüzü -->
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="rank-info" onclick="toggleRankModal(true)">
                <div class="rank-badge" id="rank-badge-icon">⭐</div>
                <div class="rank-text">
                    <h3 id="rank-title">Demir I</h3>
                    <p><span id="current-xp">0</span> / <span id="max-xp">100</span> XP</p>
                    <div class="xp-bar-container">
                        <div class="xp-bar-fill" id="xp-fill"></div>
                    </div>
                </div>
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
                <div style="font-size: 11px; color: #ddd; text-align: right;" id="time-display">07:00</div>
                <button class="settings-btn" onclick="toggleSettingsModal(true)">⚙️</button>
            </div>
        </div>

        <!-- Haftalık Seri -->
        <div class="weekly-series" id="weekly-container"></div>

        <!-- Görevler -->
        <div class="section-title">Günlük Görev Havuzu</div>
        <div class="tasks-container" id="tasks-list"></div>

        <!-- Yeni Görev İsteme: Büyük Artı Düğmesi -->
        <div class="add-task-container">
            <div class="big-plus-btn" onclick="addNewTaskWithAnimation(this)">
                <div style="display:flex; align-items:center; justify-content:center; width:100%; height:100%; position:relative;">
                    <span class="plus-icon plus-left" style="position:absolute; left:18px;">+</span>
                    <span class="plus-icon plus-right" style="position:absolute; right:18px;">+</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Geniş 1000+ Görev Havuzu Örnekleri
    const taskPool = [
        { text: "Sabit saatte uyan ve 10 dk esneme yap", cat: "Spor", xp: 10, diff: "Kolay" },
        { text: "2 litre su tüketim hedefini tamamla", cat: "Kişisel Gelişim", xp: 10, diff: "Kolay" },
        { text: "Bugün en az 20 sayfa kitap oku", cat: "Kişisel Gelişim", xp: 15, diff: "Orta" },
        { text: "30 dakika tempolu yürüyüş yap", cat: "Spor", xp: 15, diff: "Orta" },
        { text: "Bir arkadaşına hal hatır sor / mesaj at", cat: "Sosyal", xp: 10, diff: "Kolay" },
        { text: "Yeni bir kelime veya yabancı dil terimi öğren", cat: "Kişisel Gelişim", xp: 10, diff: "Kolay" },
        { text: "Akşam ekran süresini yatmadan 1 saat önce kes", cat: "Kişisel Gelişim", xp: 20, diff: "Zor" },
        { text: "50 adet şınav / mekik serisi tamamla", cat: "Spor", xp: 20, diff: "Zor" },
        { text: "Sevdiklerine kahve veya çay ikram et", cat: "Sosyal", xp: 15, diff: "Orta" },
        { text: "Günlük bütçe ve harcama kontrolü yap", cat: "Kişisel Gelişim", xp: 10, diff: "Kolay" },
        { text: "15 dakika meditasyon veya nefes egzersizi yap", cat: "Kişisel Gelişim", xp: 15, diff: "Orta" },
        { text: "Açık havada güneş ışığı alarak 10 dk yürü", cat: "Spor", xp: 10, diff: "Kolay" }
    ];

    let player = {
        xp: 0,
        rankLevel: 1,
        currentStreak: [true, true, true, true, true, true, false] // Pzt-Cmt tamam, Pazar (index 6) henüz değil
    };

    const ranks = [
        { name: "Demir I", max: 100, goldFrame: false },
        { name: "Demir II", max: 100, goldFrame: false },
        { name: "Demir III", max: 100, goldFrame: false },
        { name: "Demir IV", max: 100, goldFrame: false },
        { name: "Demir V", max: 100, goldFrame: true },
        { name: "Bronz I", max: 150, goldFrame: false },
        { name: "Altın I", max: 200, goldFrame: false },
        { name: "Gümüş I", max: 250, goldFrame: false },
        { name: "Elmas I", max: 300, goldFrame: false },
        { name: "Siyah Elmas", max: 500, goldFrame: true }
    ];

    let activeTasks = [];

    function getRandomTasks(count = 3) {
        let selected = [];
        let poolCopy = [...taskPool];
        for (let i = 0; i < count; i++) {
            if (poolCopy.length === 0) break;
            let index = Math.floor(Math.random() * poolCopy.length);
            selected.push({ ...poolCopy[index], id: Date.now() + i, completed: false, pending: false, timer: null });
            poolCopy.splice(index, 1);
        }
        return selected;
    }

    function updateUI() {
        let rank = ranks[player.rankLevel - 1] || ranks[ranks.length - 1];
        document.getElementById("rank-title").innerText = rank.name;
        document.getElementById("current-xp").innerText = player.xp;
        document.getElementById("max-xp").innerText = rank.max;
        
        let percent = Math.min(100, (player.xp / rank.max) * 100);
        document.getElementById("xp-fill").style.width = percent + "%";

        let badge = document.getElementById("rank-badge-icon");
        if (rank.goldFrame) badge.classList.add("gold-frame");
        else badge.classList.remove("gold-frame");

        // Haftalık Seri Render (Pazar dahil)
        let days = ["Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"];
        let weeklyHTML = "";
        for (let i = 0; i < 7; i++) {
            let isComp = player.currentStreak[i];
            weeklyHTML += `
                <div class="day-box ${isComp ? 'completed' : ''}">
                    <span>${days[i]}</span>
                    <span class="day-star">${isComp ? '⭐' : '·'}</span>
                </div>
            `;
        }
        document.getElementById("weekly-container").innerHTML = weeklyHTML;

        // Görevler Render
        let tasksHTML = "";
        activeTasks.forEach((t, idx) => {
            if (t.completed) {
                tasksHTML += `
                    <div class="task-card completed" style="position:relative;">
                        <div class="center-red-star"></div>
                    </div>
                `;
            } else if (t.pending) {
                tasksHTML += `
                    <div class="task-card pending-confirm">
                        <div class="confirm-box">
                            <div class="confirm-top">
                                <span>Onayla bekleniyor...</span>
                                <button class="confirm-btn" onclick="confirmTask(${idx})">TAMAMLA</button>
                            </div>
                            <div class="countdown-bar">
                                <div class="countdown-fill" id="cd-${idx}"></div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                tasksHTML += `
                    <div class="task-card" onclick="startTaskPending(${idx})">
                        <div class="task-info">
                            <h4>${t.text}</h4>
                            <div class="meta"><span>${t.cat}</span> • <span>${t.diff}</span></div>
                        </div>
                        <div class="task-xp">+${t.xp} XP</div>
                    </div>
                `;
            }
        });
        document.getElementById("tasks-list").innerHTML = tasksHTML;

        activeTasks.forEach((t, idx) => {
            if (t.pending) {
                setTimeout(() => {
                    let fill = document.getElementById(`cd-${idx}`);
                    if (fill) fill.style.width = "0%";
                }, 50);
            }
        });
    }

    function startTaskPending(idx) {
        let t = activeTasks[idx];
        if (t.completed || t.pending) return;

        t.pending = true;
        updateUI();

        t.timer = setTimeout(() => {
            if (t.pending && !t.completed) {
                t.pending = false;
                updateUI();
            }
        }, 5000);
    }

    function confirmTask(idx) {
        let t = activeTasks[idx];
        if (!t.pending) return;

        clearTimeout(t.timer);
        t.pending = false;
        t.completed = true;

        // Sağdan ve soldan yıldız uçuş animasyonu elementleri ekle
        let cardEl = document.querySelectorAll('.task-card')[idx];
        if (cardEl) {
            let leftStar = document.createElement('div');
            leftStar.className = 'flying-star-left animate-fly-left';
            leftStar.innerHTML = '⭐';
            leftStar.style.left = '10px';
            leftStar.style.top = '50%';
            cardEl.appendChild(leftStar);

            let rightStar = document.createElement('div');
            rightStar.className = 'flying-star-right animate-fly-right';
            rightStar.innerHTML = '⭐';
            rightStar.style.right = '10px';
            rightStar.style.top = '50%';
            cardEl.appendChild(rightStar);
        }

        // XP ve Rütbe Kontrolü (Rank her gün sıfırlanmaz, kalıcıdır)
        player.xp += t.xp;
        let currentRankMax = ranks[player.rankLevel - 1].max;
        if (player.xp >= currentRankMax) {
            player.xp -= currentRankMax;
            player.rankLevel = Math.min(ranks.length, player.rankLevel + 1);
            triggerRankShakeAndUp(ranks[player.rankLevel - 1].name);
        }

        // Pazar günü (index 6) görevi tamamlandıysa ve tüm hafta bittiyse dev yıldız göster
        player.currentStreak[6] = true; // Test amaçlı pazar tamamlandı sayalım
        if (player.currentStreak.every(v => v === true)) {
            setTimeout(() => {
                document.getElementById("weekly-celebration").classList.add("active");
            }, 800);
        }

        setTimeout(() => {
            updateUI();
        }, 600);
    }

    function triggerRankShakeAndUp(newRankName) {
        let badge = document.getElementById("rank-badge-icon");
        badge.classList.add("shake-animation");
        setTimeout(() => badge.classList.remove("shake-animation"), 600);
    }

    function closeWeeklyCelebration() {
        document.getElementById("weekly-celebration").classList.remove("active");
    }

    // Artı butonuna basınca sağa sola bölünme ve yeni görev ekleme
    function addNewTaskWithAnimation(btn) {
        btn.classList.add("splitting");
        setTimeout(() => {
            let newT = getRandomTasks(1)[0];
            if (newT) {
                activeTasks.push(newT);
                updateUI();
            }
            btn.classList.remove("splitting");
        }, 400);
    }

    // Rütbe Listesi Modalı
    function toggleRankModal(show) {
        let modal = document.getElementById("rank-modal");
        if (show) {
            let html = "";
            ranks.forEach((r, idx) => {
                let isCurrent = (idx + 1 === player.rankLevel);
                html += `
                    <div class="rank-list-item ${isCurrent ? 'current' : ''}">
                        <span>${idx + 1}. ${r.name}</span>
                        <span>${isCurrent ? '★ (Mevcut)' : r.max + ' XP'}</span>
                    </div>
                `;
            });
            document.getElementById("rank-list-container").innerHTML = html;
            modal.classList.add("active");
        } else {
            modal.classList.remove("active");
        }
    }

    // Ayarlar Modalı
    function toggleSettingsModal(show) {
        let modal = document.getElementById("settings-modal");
        if (show) modal.classList.add("active");
        else modal.classList.remove("active");
    }

    function saveSettings() {
        let t1 = document.getElementById("notif-1").value;
        let t2 = document.getElementById("notif-2").value;
        let t3 = document.getElementById("notif-3").value;
        
        // Bildifim simülasyonu / web notifications API request
        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }
        alert(`Bildirimler başarıyla ayarlandı!
Günlük Saatler: ${t1}, ${t2}, ${t3}`);
        toggleSettingsModal(false);
    }

    // Animasyonlu Kanvas Arka Plan
    const canvas = document.getElementById("bg-canvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let cloudOffset = 0;
    let trainPos = 0;

    function drawAnimatedBackground() {
        let now = new Date();
        let hour = now.getHours();
        let minute = now.getMinutes();
        document.getElementById("time-display").innerText = String(hour).padStart(2, '0') + ":" + String(minute).padStart(2, '0');

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let w = canvas.width;
        let h = canvas.height;

        cloudOffset += 0.2;
        if (cloudOffset > w) cloudOffset = 0;

        trainPos += 1.5;
        if (trainPos > w + 100) trainPos = -100;

        if (hour >= 7 && hour < 13) {
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, "#4facfe");
            grad.addColorStop(1, "#00f2fe");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = "#fffacd";
            ctx.beginPath();
            ctx.arc(w * 0.75, h * 0.3, 35, 0, Math.PI * 2);
            ctx.fill();

            drawBuildings(["#203a43", "#2c5364", "#1a2530"]);
        } else if (hour >= 13 && hour < 19) {
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, "#2980b9");
            grad.addColorStop(1, "#6dd5fa");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.fillRect((w * 0.1 + cloudOffset) % (w + 100) - 50, h * 0.15, 90, 22);
            ctx.fillRect((w * 0.6 + cloudOffset * 0.7) % (w + 100) - 50, h * 0.28, 110, 26);

            drawBuildings(["#1b4f72", "#154360", "#0e3a50"]);
        } else if (hour >= 19 && hour < 21) {
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, "#cb356b");
            grad.addColorStop(1, "#bd3f32");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = "#f39c12";
            ctx.beginPath();
            ctx.arc(w * 0.5, h * 0.4, 40, 0, Math.PI * 2);
            ctx.fill();

            drawBuildings(["#4a1525", "#3a101b", "#250810"]);

            ctx.fillStyle = "#f1c40f";
            ctx.fillRect(trainPos, h - 85, 80, 16);
            ctx.fillStyle = "#333";
            ctx.fillRect(trainPos + 10, h - 83, 14, 10);
            ctx.fillRect(trainPos + 35, h - 83, 14, 10);
            ctx.fillRect(trainPos + 60, h - 83, 14, 10);
        } else {
            let grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, "#09122c");
            grad.addColorStop(1, "#181c3d");
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            ctx.fillStyle = "#ffffff";
            for (let i = 0; i < 45; i++) {
                let sx = (i * 41) % w;
                let sy = (i * 27) % (h * 0.65);
                ctx.fillRect(sx, sy, 2, 2);
            }

            drawBuildings(["#0f172a", "#1e293b", "#0b0f19"]);
        }

        requestAnimationFrame(drawAnimatedBackground);
    }

    function drawBuildings(colors) {
        let w = canvas.width;
        let h = canvas.height;
        let bWidth = 42;
        let count = Math.ceil(w / bWidth) + 1;

        for (let i = 0; i < count; i++) {
            let bH = 130 + ((i * 47) % 170);
            let x = i * (bWidth - 2);
            let y = h - bH;

            ctx.fillStyle = colors[i % colors.length];
            ctx.fillRect(x, y, bWidth, bH);

            ctx.fillStyle = "rgba(255, 255, 200, 0.65)";
            for (let wx = x + 6; wx < x + bWidth - 6; wx += 10) {
                for (let wy = y + 12; wy < h - 10; wy += 18) {
                    if ((i + wx + wy) % 3 !== 0) {
                        ctx.fillRect(wx, wy, 5, 8);
                    }
                }
            }
        }
    }

    window.onload = () => {
        activeTasks = getRandomTasks(4);
        updateUI();
        resizeCanvas();
        requestAnimationFrame(drawAnimatedBackground);

        // Açılış İkon Animasyonu (İkon ile Tam Uyumlu Büyüme Geçişi)
        setTimeout(() => {
            let splash = document.getElementById("splash-screen");
            splash.classList.add("zoom-out");
        }, 1200);
    };
</script>
